<title>Lumora — Serien und Zusammenfügen (Entwurf 28)</title>
<style>
/* =====================================================================
   Mockup 28 · Serien und Zusammenfügen — aus mehreren Fotos eines (ADR-0078).
   ENTWURF, Abnahme durch Herbert ausstehend.
   Umfang (17 Ansichten, oben umschaltbar; Zustände je Ansicht in der zweiten Zeile):
    1 Galerie mit Marken („Serie · n Fotos“ nur auf dem ersten Foto, Punkt auf den übrigen, Ergebnis-Marke „aus n Fotos“)
    2 Filter „Serien“ (Chip „Serien · 12 neu“, Flyout mit Arten/Zustand/Stand/Stapel, eine Kachel je Serie, Ein-Klick-Knopf)
    3 Geöffnete Serie (statt Aufklappen: Bedingung + Serien-Leiste mit Gründen, Verfahren ▾, Serie anpassen)
    4 Rechtsklick im gemeinsamen Foto-Menü: Bearbeiten ▸ „5 Fotos zusammenfügen…“, „Serie mit 26 Fotos zusammenfügen…“,
      Marke, Suchen ▸, Listenansicht, Lightbox (auch aus einer Story geöffnet) und das Fenster danach mit den
      Zeit-Nachbarn (noch nicht angehakt), aus einem Album, gesperrt (gemischte Bibliotheken)
    5 Fenster „Zusammenfügen“ · Panorama mit allen Aufnahmearten (Automatisch, Kugel 360°, Zylinder, Perspektive, Vertikal,
      Nur verschieben), Vorschau, Stufe 1 (übrige „kommt später“), HDR-Panorama
    6 Belichtungsreihe (HDR) mit Vorher/Nachher und „Danach hochskalieren“ samt Grenzen
    7 Serienbild: Entrauschen / mehr Details, Leute entfernen (Maske), Langzeit
    8 Fokus-Stapel mit Schärfe-Herkunft     9 Bestes Gruppenfoto (Gesichter je Person)     10 Zeitraffer (FFmpeg)
   11 Speichern → Rechnen → Fertig (Kennzeichnung „aus 26 Fotos zusammengefügt“, Rückgängig, auch ins Album)
   12 Stapel „48 Panoramen zusammenfügen“   13 Aktivitäts-Anzeige (Speichern, Vorschau, Fertig-Meldung)
   14 Lightbox mit Ergebnis   15 Einstellungen › Zusammenfügen   16 Hinweise (OneDrive, RAW, Speicher, Bibliotheken,
      Teil einer Serie, mehrere Serien)   17 Versteckte Sitzung (gleich, alles im Container)
   Tokens 1:1 aus Mockup 08 (dazu --warning-soft wie 10/13/14/26 und --smoke wie 13/18). Galerie-Rahmen wie 18/24/26,
   dunkle Bühne und Lightbox mit den festen Farben aus Mockup 13, Aktivitäts-Anzeige wie 15. Alle Fotos sind
   CSS-Verläufe und Platzhalter-Formen, Gesichter neutrale Kreise; Namen, Ordner, Alben und Dateinamen sind erfundene
   Muster, Zahlen aus dem ADR (110 DJI-Ordner: 48 × 26, 43 × 21, 6 × 9, 3 × 3; 26 Fotos in 51 s).
   Spike 20 (Panorama-Werkzeug) ist ausstehend — das Mockup zeigt Bedienung, nicht die Werkzeugwahl.
   Oberflächentexte mit drei Punkten ohne Leerzeichen davor, wie alle Einträge des Foto-Menüs („Foto verbessern…“).
   Hell/Dunkel über die Klasse „dark“ am body; beim Öffnen nach der Systemeinstellung (prefers-color-scheme) wie 08/13.
   ===================================================================== */
:root {
  --mica-base:#F3F3F3; --layer-default:rgba(255,255,255,0.7); --layer-card:#FFFFFF; --layer-subtle:rgba(0,0,0,0.026);
  --layer-secondary:rgba(0,0,0,0.04); --layer-tertiary:rgba(0,0,0,0.06);
  --text-primary:#1A1A1A; --text-secondary:#5C5C5C; --text-tertiary:#8B8B8B; --text-disabled:#B5B5B5; --text-on-accent:#FFFFFF;
  --stroke-default:rgba(0,0,0,0.0578); --stroke-secondary:rgba(0,0,0,0.0357); --stroke-divider:rgba(0,0,0,0.0803); --stroke-card:rgba(0,0,0,0.0578); --ctl-bottom:rgba(0,0,0,0.16);
  --accent:#5B5FC7; --accent-light:#7579D8; --accent-dark:#4145A0; --accent-soft:rgba(91,95,199,0.08); --accent-soft-2:rgba(91,95,199,0.16);
  --success:#107C10; --success-soft:rgba(16,124,16,0.10); --warning:#C29C00; --warning-soft:rgba(194,156,0,0.14); --danger:#C42B1C;
  --shadow-card:0 2px 4px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03); --shadow-flyout:0 8px 16px rgba(0,0,0,0.14); --shadow-dialog:0 32px 64px rgba(0,0,0,0.18);
  --brand-indigo:#5B5FC7; --brand-violet:#8B5CF6; --brand-coral:#F97362; --brand-amber:#F5A524;
  --inbox:#A8650F; --inbox-soft:rgba(245,165,36,0.18); --star:#F2B01E; --heart:#E5484D;
  --page-bg:#E4E4EA; --smoke:rgba(0,0,0,0.3);
}
body.dark {
  color-scheme:dark;
  --mica-base:#202020; --layer-default:rgba(43,43,43,0.7); --layer-card:#2C2C2C; --layer-subtle:rgba(255,255,255,0.03);
  --layer-secondary:rgba(255,255,255,0.0418); --layer-tertiary:rgba(255,255,255,0.0605);
  --text-primary:#FFFFFF; --text-secondary:#D0D0D0; --text-tertiary:#A0A0A0; --text-disabled:#6A6A6A;
  --stroke-default:rgba(255,255,255,0.0837); --stroke-secondary:rgba(255,255,255,0.0698); --stroke-divider:rgba(255,255,255,0.0837); --stroke-card:rgba(255,255,255,0.0578); --ctl-bottom:rgba(255,255,255,0.22);
  --accent:#818CF8; --accent-light:#A5B0FF; --accent-dark:#6066D8; --accent-soft:rgba(129,140,248,0.12); --accent-soft-2:rgba(129,140,248,0.24);
  --success:#6CCB5F; --success-soft:rgba(108,203,95,0.12); --warning:#FCE100; --warning-soft:rgba(252,225,0,0.14); --danger:#FF6B5E;
  --shadow-card:0 2px 4px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.22); --shadow-flyout:0 8px 16px rgba(0,0,0,0.4); --shadow-dialog:0 32px 64px rgba(0,0,0,0.5);
  --brand-indigo:#818CF8; --brand-violet:#A78BFA; --brand-coral:#FB8A7A; --brand-amber:#FBBF24;
  --inbox:#FBBF24; --inbox-soft:rgba(251,191,36,0.14); --star:#FBBF24; --heart:#FF6B6B;
  --page-bg:#121214; --smoke:rgba(0,0,0,0.55);
}
* { box-sizing:border-box; } html,body { margin:0; }
body { background:var(--page-bg); color:var(--text-primary); font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; font-size:14px; }
button { font:inherit; color:inherit; }
.ic { font-family:'Segoe Fluent Icons','Segoe MDL2 Assets'; font-size:16px; line-height:1; font-style:normal; font-weight:400; }
.ic.s { font-size:12px; }
.ki { width:12px; height:12px; flex:none; fill:none; stroke:currentColor; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; }
.ki.l { width:16px; height:16px; }
.hidden { display:none !important; }
.muted { color:var(--text-secondary); font-size:12px; line-height:1.5; }
.mono { font-family:'Cascadia Mono',Consolas,monospace; font-size:12px; }
.link { color:var(--accent); cursor:pointer; font-size:12px; font-weight:600; white-space:nowrap; }

/* ---------- Mockup-Leiste ---------- */
.mock-bar { position:sticky; top:0; z-index:100; display:flex; gap:10px 16px; align-items:center; flex-wrap:wrap; padding:7px 20px; background:#2B2B33; color:#EEE; font-size:12px; }
.mock-bar .grp { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.mock-bar button { background:#44444F; color:#EEE; border:1px solid #5A5A66; border-radius:4px; padding:3px 9px; cursor:pointer; font-size:12px; }
.mock-bar button.on { background:#5B5FC7; border-color:#7579D8; }
.mock-bar .row2 { width:100%; display:flex; gap:4px; align-items:center; flex-wrap:wrap; min-height:24px; color:#AAB; }
.mock-bar .row2 button { background:#363640; }
.mock-bar .row2 button.on { background:#4145A0; border-color:#7579D8; }
.stage-wrap { padding:16px 20px 12px; display:flex; justify-content:center; }
.win-box { position:relative; flex:none; }
.caption { margin:0 auto 36px; padding:12px 16px; font-size:13px; line-height:1.6; color:var(--text-secondary); background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; box-shadow:var(--shadow-card); }
.caption b { color:var(--text-primary); }

/* ---------- Hauptfenster (wie 18/24/26) ---------- */
.window { position:absolute; left:0; top:0; transform-origin:0 0; background:var(--mica-base); border-radius:8px; border:1px solid var(--stroke-default);
  box-shadow:0 16px 48px rgba(0,0,0,0.22); overflow:hidden; display:grid; grid-template-columns:232px 1fr; grid-template-rows:36px 1fr 30px; }
.titlebar { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding-left:14px; font-size:12px; color:var(--text-secondary); }
.titlebar .tile { width:16px; height:16px; border-radius:4px; background:linear-gradient(135deg,#6366F1,#4145A0); }
.titlebar .wc { margin-left:auto; display:flex; height:100%; } .titlebar .wc span { width:46px; display:grid; place-items:center; font-family:'Segoe Fluent Icons'; font-size:10px; color:var(--text-primary); }
.nav { padding:2px 8px 10px; display:flex; flex-direction:column; gap:2px; }
.wbs { font-family:'Segoe UI Variable Display','Segoe UI',sans-serif; font-size:22px; padding:2px 12px 10px;
  background:linear-gradient(100deg,var(--brand-indigo),var(--brand-violet) 45%,var(--brand-coral) 75%,var(--brand-amber)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lib-switch { margin:0 2px 8px; padding:8px 10px; border-radius:6px; background:var(--layer-card); border:1px solid var(--stroke-card); box-shadow:var(--shadow-card); display:flex; gap:10px; align-items:center; }
.lib-switch b { display:block; font-weight:600; } .lib-switch small { display:block; color:var(--text-tertiary); font-size:11px; }
.nav-item { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:4px; position:relative; white-space:nowrap; }
.nav-item.active { background:var(--layer-secondary); }
.nav-item.active::before { content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:2px; background:var(--accent); }
.nav .spacer { flex:1; }
.content { position:relative; min-width:0; min-height:0; background:var(--layer-default); border-top-left-radius:8px; border-left:1px solid var(--stroke-default); border-top:1px solid var(--stroke-default); overflow:hidden; display:flex; flex-direction:column; }
.content.scroll { overflow:auto; display:block; }
.statusbar { grid-column:1/-1; position:relative; z-index:30; display:flex; align-items:center; gap:18px; padding:0 0 0 14px; font-size:12px; color:var(--text-secondary); border-top:1px solid var(--stroke-divider); background:var(--mica-base); }
.btn-acc { background:var(--accent); color:var(--text-on-accent); border:1px solid transparent; border-radius:4px; padding:5px 14px; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; white-space:nowrap; }
body.dark .btn-acc { color:#111; } .btn-acc:hover { background:var(--accent-light); }
.btn-acc[disabled] { background:var(--layer-tertiary); color:var(--text-disabled); cursor:default; }
.btn-std { background:var(--layer-card); border:1px solid var(--stroke-divider); border-bottom-color:var(--ctl-bottom); border-radius:4px; padding:5px 12px; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; white-space:nowrap; }
.btn-std:hover { background:var(--layer-subtle); }
.btn-std.on { background:var(--accent-soft-2); border-color:var(--accent); }
.btn-std[disabled] { color:var(--text-disabled); cursor:default; }
.ibtn { width:28px; height:28px; border-radius:4px; border:0; background:transparent; display:grid; place-items:center; cursor:pointer; color:var(--text-secondary); }
.ibtn:hover { background:var(--layer-secondary); }
.split-acc { display:inline-flex; position:relative; }
.split-acc .btn-acc:first-child { border-radius:4px 0 0 4px; }
.split-acc .btn-acc + .btn-acc { border-radius:0 4px 4px 0; border-left:1px solid rgba(255,255,255,.35); padding:5px 8px; }
body.dark .split-acc .btn-acc + .btn-acc { border-left-color:rgba(0,0,0,.25); }

/* ---------- Galerie ---------- */
.ghead { display:flex; align-items:center; gap:14px; padding:16px 24px 4px; }
.ghead h1 { margin:0; font-size:26px; font-weight:600; }
.crumb { font-size:13px; color:var(--text-secondary); display:flex; gap:6px; align-items:center; }
.crumb b { color:var(--text-primary); font-weight:600; }
.fcard { margin:6px 24px 10px; background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; box-shadow:var(--shadow-card); position:relative; flex:none; }
.frow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 14px; }
.frow + .frow { padding-top:0; }
.frow .lbl { width:54px; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--text-tertiary); }
.chip { display:inline-flex; gap:6px; align-items:center; height:30px; padding:0 10px; border-radius:15px; border:1px solid var(--stroke-divider); background:var(--layer-card); font-size:13px; cursor:pointer; white-space:nowrap; }
.chip.on { background:var(--accent-soft-2); border-color:var(--accent); color:var(--accent-dark); font-weight:600; }
body.dark .chip.on { color:var(--accent-light); }
.chip .new { font-size:10px; font-weight:700; border-radius:7px; padding:0 5px; background:var(--accent); color:var(--text-on-accent); }
body.dark .chip .new { color:#111; }
.chip.sm { height:26px; font-size:12px; }
.active-row { padding:7px 14px; border-top:1px solid var(--stroke-divider); background:var(--layer-subtle); font-size:12px; color:var(--text-secondary); border-radius:0 0 8px 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.active-row .cond { background:var(--layer-card); border:1px solid var(--stroke-divider); border-radius:10px; padding:1px 8px; color:var(--text-primary); display:inline-flex; gap:5px; align-items:center; }
.gal { display:grid; grid-template-columns:repeat(var(--cols,6),1fr); gap:6px; padding:2px 24px 20px; align-content:start; min-height:0; overflow:hidden; flex:1; }
.dayh { grid-column:1/-1; font-size:13px; font-weight:600; padding:6px 0 0; display:flex; gap:10px; align-items:baseline; }
.dayh small { font-weight:400; color:var(--text-tertiary); font-size:12px; }
.tile { position:relative; aspect-ratio:4/3; border-radius:6px; }
.tile .bg { position:absolute; inset:0; border-radius:inherit; overflow:hidden; }
.tile.sel { outline:3px solid var(--accent); outline-offset:-3px; }
.tile.dim .bg { opacity:.4; }
.smk { position:absolute; top:6px; left:6px; height:20px; padding:0 8px 0 6px; border-radius:10px; background:rgba(0,0,0,.58); color:#fff; font-size:11px; font-weight:600; display:inline-flex; gap:5px; align-items:center; z-index:2; white-space:nowrap; }
.smk .ok { width:14px; height:14px; border-radius:50%; background:#6CCB5F; color:#111; display:grid; place-items:center; font-family:'Segoe Fluent Icons'; font-size:8px; }
.sdot { position:absolute; top:8px; left:8px; width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.45); z-index:2; }
.rmk { position:absolute; left:6px; bottom:6px; height:20px; padding:0 8px 0 6px; border-radius:10px; background:var(--accent); color:#fff; font-size:11px; font-weight:600; display:inline-flex; gap:5px; align-items:center; z-index:2; white-space:nowrap; }
body.dark .rmk { color:#111; }
.pair { position:absolute; right:6px; bottom:6px; font-size:10px; font-weight:700; background:rgba(0,0,0,.6); color:#fff; border-radius:8px; padding:1px 7px; z-index:2; }
.vlen { position:absolute; right:6px; bottom:6px; font-size:10px; font-weight:700; background:rgba(0,0,0,.6); color:#fff; border-radius:8px; padding:1px 7px; z-index:2; display:flex; gap:4px; align-items:center; }
.tchk { position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:4px; background:rgba(255,255,255,.9); border:1px solid rgba(0,0,0,.35); display:grid; place-items:center; font-family:'Segoe Fluent Icons'; font-size:10px; color:transparent; z-index:3; }
.tchk.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.tip { position:absolute; z-index:30; background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:6px; box-shadow:var(--shadow-flyout); padding:7px 10px; font-size:12px; line-height:1.45; white-space:nowrap; color:var(--text-primary); }
body.dark .tip { background:#2B2B2B; }
.abar { margin:0 24px 8px; display:flex; gap:8px; align-items:center; padding:6px 10px; border-radius:8px; background:var(--accent-soft); border:1px solid var(--accent-soft-2); font-size:13px; flex:none; }
.abar b { margin-right:6px; }
.abar .sp { flex:1; }
/* Listenansicht */
.lst td { padding:3px 8px; } .lst tr.lsel td { background:var(--accent-soft-2); }
.lth { position:relative; display:block; width:44px; height:30px; border-radius:3px; overflow:hidden; }
/* eine Kachel je Serie */
.stile { position:relative; padding:8px 8px 0 0; }
.stile .cv { position:relative; aspect-ratio:16/9; border-radius:6px; box-shadow:4px -4px 0 -1px var(--layer-card), 4px -4px 0 0 var(--stroke-divider), 8px -8px 0 -1px var(--layer-card), 8px -8px 0 0 var(--stroke-divider); }
.stile .cv .bg { position:absolute; inset:0; border-radius:6px; overflow:hidden; }
.stile .meta { padding:6px 2px 0; font-size:12px; color:var(--text-secondary); }
.stile .meta b { display:flex; gap:6px; align-items:center; font-size:13px; font-weight:600; color:var(--text-primary); }
.stile .neu { position:absolute; top:6px; right:6px; font-size:10px; font-weight:700; border-radius:7px; padding:1px 6px; background:var(--accent); color:#fff; z-index:2; }
body.dark .stile .neu { color:#111; }
.stile .cloud { position:absolute; top:6px; left:6px; font-size:10px; border-radius:7px; padding:1px 7px; background:rgba(0,0,0,.6); color:#fff; z-index:2; display:flex; gap:4px; align-items:center; }
.oneclick { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:inline-flex; border-radius:4px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.35); z-index:3; }
.oneclick span { background:var(--accent); color:#fff; padding:5px 10px; font-size:12px; display:flex; gap:6px; align-items:center; white-space:nowrap; }
.oneclick span + span { border-left:1px solid rgba(255,255,255,.35); padding:5px 8px; }
body.dark .oneclick span { color:#111; } body.dark .oneclick span + span { border-left-color:rgba(0,0,0,.25); }
.stile.hov .cv { outline:2px solid var(--accent); outline-offset:1px; }
/* Serien-Leiste */
.serbar { margin:0 24px 8px; display:grid; grid-template-columns:auto 1fr auto; gap:10px 14px; align-items:center; padding:10px 14px; border-radius:8px; background:var(--layer-card); border:1px solid var(--stroke-card); box-shadow:var(--shadow-card); position:relative; flex:none; }
.serbar .sp { width:38px; height:38px; border-radius:8px; display:grid; place-items:center; background:var(--accent-soft-2); color:var(--accent); }
.serbar > div > b { font-size:15px; font-weight:600; }
.serbar .facts { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary); margin-top:2px; }
.rchips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.rchip { font-size:11px; border-radius:9px; padding:1px 8px; background:var(--layer-secondary); color:var(--text-secondary); display:inline-flex; gap:4px; align-items:center; }
.rchip::before { content:'\E73E'; font-family:'Segoe Fluent Icons'; font-size:8px; color:var(--success); }
.serbar .acts { grid-column:2/-1; display:flex; gap:8px; align-items:center; }
.probe { width:156px; height:52px; border-radius:4px; position:relative; overflow:hidden; }
.probe small { position:absolute; left:4px; bottom:3px; font-size:9px; color:#fff; background:rgba(0,0,0,.55); border-radius:6px; padding:0 5px; z-index:2; }
.hintbar { margin:0 24px 8px; display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:6px; font-size:12px; background:var(--accent-soft); flex:none; }
.hintbar .sp { flex:1; }

/* ---------- Menüs, Flyouts, Dialoge ---------- */
.menu { position:absolute; z-index:40; min-width:250px; background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; box-shadow:var(--shadow-flyout); padding:4px; font-size:13px; }
body.dark .menu { background:#2B2B2B; }
.mi { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; padding:6px 8px; border-radius:4px; white-space:nowrap; height:30px; }
.mi:hover, .mi.hov { background:var(--layer-secondary); }
.mi .ic, .mi .ki { font-size:14px; color:var(--text-secondary); justify-self:center; }
.mi .k { font-size:11px; color:var(--text-tertiary); }
.mi.new { background:var(--accent-soft-2); font-weight:600; }
.mi.new .ic, .mi.new .ki { color:var(--accent); }
.mi.off { color:var(--text-disabled); } .mi.off .ic, .mi.off .ki { color:var(--text-disabled); }
.mi .badge { font-size:10px; font-weight:700; border-radius:7px; padding:0 6px; background:var(--accent); color:var(--text-on-accent); }
body.dark .mi .badge { color:#111; }
.mi small { font-weight:400; color:var(--text-secondary); font-size:11px; }

.mask small { position:absolute; left:100%; top:-4px; margin-left:6px; white-space:nowrap; font-size:10px; background:rgba(0,0,0,.6); color:#fff; padding:1px 6px; border-radius:6px; }
/* Gruppenfoto */
.gp { position:absolute; bottom:0; width:11%; height:50%; border-radius:40% 40% 6% 6%; }
.gp .hd { position:absolute; left:50%; top:-32%; width:64%; aspect-ratio:1; transform:translateX(-50%); border-radius:50%; background:#D9D4CF; }
.gp .fr { position:absolute; left:50%; top:-38%; width:88%; aspect-ratio:1; transform:translateX(-50%); border:2px solid #fff; border-radius:6px; }
.gp .fr b { position:absolute; top:-11px; left:-11px; width:20px; height:20px; border-radius:50%; background:#818CF8; color:#111; font-size:11px; display:grid; place-items:center; }
.gp .fr.sw2 { border-color:#6CCB5F; } .gp .fr.sw2 b { background:#6CCB5F; }
.gp .fr.uns { border-style:dashed; border-color:#FCE100; } .gp .fr.uns b { background:#FCE100; }
.faces { border-top:1px solid #26262C; background:#1E1E22; padding:8px 12px 10px; display:grid; gap:4px; }
.frw { display:grid; grid-template-columns:120px repeat(6,62px) 1fr; gap:6px; align-items:center; font-size:12px; color:#CCC; }
.frw.hdr { font-size:10px; color:#AAA; }
.frw .who { display:flex; gap:6px; align-items:center; }
.frw .who b { width:18px; height:18px; border-radius:50%; background:#818CF8; color:#111; display:grid; place-items:center; font-size:10px; }
.fc { position:relative; height:40px; border-radius:6px; background:#26262C; display:grid; place-items:center; border:2px solid transparent; }
.fc i { width:26px; height:26px; border-radius:50%; background:#D9D4CF; display:block; }
.fc.on { border-color:#818CF8; background:#2C2C3A; }
.fc.blur i { filter:blur(2px); } .fc.turn i { background:linear-gradient(90deg,#D9D4CF 45%,#8E8781 46%); }
.fc em { position:absolute; left:2px; right:2px; bottom:-1px; font-style:normal; font-size:8.5px; text-align:center; background:rgba(0,0,0,.65); color:#EEE; border-radius:3px; }
.fc.on em { background:#818CF8; color:#111; }
.frw .nt { font-size:11px; color:#AAA; }
/* Fortschritt / Fertig im Fenster */
.prog { width:560px; display:grid; gap:10px; color:#EEE; }
.prog h2 { margin:0; font-size:20px; font-weight:600; }
.prog .m2 { font-size:12px; color:#AAA; line-height:1.5; }
.pl { display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:center; padding:5px 0; font-size:13px; }
.pl .d { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-family:'Segoe Fluent Icons'; font-size:10px; background:#26262C; color:#AAA; }
.pl.done .d { background:#6CCB5F; color:#111; } .pl.run .d { background:#818CF8; color:#111; }
.pl.run { font-weight:600; } .pl small { color:#AAA; font-size:12px; font-weight:400; }
.bigbar { height:8px; border-radius:4px; background:#26262C; overflow:hidden; } .bigbar i { display:block; height:100%; background:#818CF8; }
.prog .btns { display:flex; gap:8px; }
.prog .btn-std { background:#26262C; border-color:#3A3A44; color:#EEE; }
.donecard { display:grid; gap:8px; }
.kenn { display:inline-flex; gap:6px; align-items:center; font-size:12px; font-weight:600; padding:3px 10px; border-radius:11px; background:var(--accent-soft-2); color:var(--accent-dark); }
body.dark .kenn { color:var(--accent-light); }
.kv { display:grid; grid-template-columns:118px 1fr; gap:4px 10px; font-size:12px; }
.kv span:nth-child(odd) { color:var(--text-secondary); }
.vbtns { display:grid; gap:6px; }
.vbtns .btn-std, .vbtns .btn-acc { justify-content:flex-start; }
/* Lightbox (wie 13) */
.lb { position:absolute; inset:0; background:#0F0F12; display:grid; grid-template-columns:1fr 320px; color:#EEE; z-index:5; }
.lb .stg { position:relative; display:grid; grid-template-rows:44px 1fr auto 74px; min-width:0; }
.lb .top { display:flex; align-items:center; gap:10px; padding:0 14px; font-size:13px; color:#CCC; }
.lb .top .r { margin-left:auto; display:flex; gap:6px; }
.lb .top .r span { padding:5px 10px; border-radius:4px; background:#26262C; font-size:12px; }
.lb .mrow { display:flex; gap:10px; align-items:center; justify-content:center; padding:8px 14px; font-size:13px; color:#DDD; }
.lb .mrow .a { color:#A5B0FF; font-weight:600; }
.lb .strip { display:flex; gap:4px; align-items:center; padding:8px 14px; overflow:hidden; border-top:1px solid #26262C; }
.lb .strip .t { flex:none; width:44px; height:44px; border-radius:3px; position:relative; overflow:hidden; opacity:.75; }
.lb .strip .t.res { width:96px; opacity:1; outline:2px solid #818CF8; outline-offset:-2px; }
.lb .side { background:#1E1E22; padding:14px 16px; display:flex; flex-direction:column; gap:10px; overflow:hidden; font-size:13px; }
.lb .side h3 { margin:0; font-size:15px; display:flex; gap:8px; align-items:center; }
.lb .side h4 { margin:6px 0 0; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#AAA; }
.lb .kv span:nth-child(odd) { color:#AAA; }
.lb .side .muted { color:#AAA; }
/* Einstellungen */
.phead { padding:18px 24px 6px; } .phead h1 { font-size:28px; font-weight:600; margin:0; }
.tabs { display:flex; gap:2px; padding:4px 24px 10px; border-bottom:1px solid var(--stroke-divider); flex-wrap:wrap; }
.tabs span { padding:6px 10px; border-radius:4px; color:var(--text-secondary); font-size:13px; }
.tabs span.on { color:var(--text-primary); font-weight:600; box-shadow:inset 0 -3px 0 var(--accent); }
.sbody { padding:14px 24px 24px; display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
.scol { display:grid; gap:12px; }
.card { background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; box-shadow:var(--shadow-card); padding:14px 16px; }
.card h2 { font-size:15px; margin:0 0 4px; display:flex; gap:10px; align-items:center; }
.srow { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--stroke-divider); font-size:13px; }
.srow:first-of-type { border-top:0; }
.srow b { display:block; font-weight:600; } .srow small { display:block; color:var(--text-secondary); font-size:12px; margin-top:1px; }
.inp { display:inline-block; min-width:64px; padding:4px 8px; border:1px solid var(--stroke-divider); border-bottom-color:var(--ctl-bottom); border-radius:4px; background:var(--layer-card); font-size:12px; text-align:right; }
.kinds { display:flex; gap:6px 14px; flex-wrap:wrap; font-size:12px; }

.s-ok { background:var(--success-soft); color:var(--success); } .s-miss { background:var(--layer-tertiary); color:var(--text-secondary); }
.where { position:absolute; right:20px; top:150px; width:400px; z-index:20; }

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ph=['#9EC9E8,#3F7FB2','#F7D99A,#C78F2B','#C8E0B5,#5E8B47','#E6B8C8,#A0567A','#D8D3EC,#6E64A8','#F3B9A8,#B4553F','#BFD9DA,#3E8287'];
const PH=i=>`<div class="ph" style="background:linear-gradient(160deg,${ph[i%7]})"></div>`;

/* Art-Symbole als Inline-SVG (keine externen Dateien) */
const KI={
 pano:'<path d="M1 3.5Q6 2 11 3.5V8.5Q6 7 1 8.5Z"/>',
 hdr:'<circle cx="6" cy="6" r="4.5"/><path d="M6 1.5A4.5 4.5 0 0 1 6 10.5Z" fill="currentColor"/>',
 stack:'<rect x="1" y="4" width="7" height="6.5" rx="1"/><path d="M3 2h7.5v6.5"/>',
 denoise:'<path d="M6 1v2.5M6 8.5V11M1 6h2.5M8.5 6H11M2.6 2.6l1.6 1.6M7.8 7.8l1.6 1.6M9.4 2.6L7.8 4.2M4.2 7.8L2.6 9.4"/>',
 people:'<circle cx="6" cy="3.4" r="1.8"/><path d="M2.6 10.6c.5-3.2 6.3-3.2 6.8 0M1.4 1.4l9.2 9.2"/>',
 long:'<path d="M1 4q2.5-2 5 0t5 0M1 8q2.5-2 5 0t5 0"/>',
 focus:'<circle cx="6" cy="6" r="1.7" fill="currentColor"/><path d="M1 4V1h3M8 1h3v3M11 8v3H8M4 11H1V8"/>',
 interval:'<circle cx="6" cy="6" r="4.6"/><path d="M6 3.2V6l2 1.3"/>',
 panohdr:'<path d="M1 3.5Q6 2 11 3.5V8.5Q6 7 1 8.5Z"/><path d="M4 6h4M6 4.2v3.6"/>',
 group:'<circle cx="4" cy="4.4" r="1.8"/><circle cx="8.3" cy="4.4" r="1.8"/><path d="M1 10.6c.5-2.2 5.5-2.2 6 0M5.4 10.6c.5-2.2 5.5-2.2 6 0"/>',
 merge:'<path d="M1.5 2.5h3l3 3.5h3M1.5 9.5h3l3-3.5"/><path d="M9 4.4L10.6 6 9 7.6"/>'};
const ki=(k,c='')=>`<svg class="ki ${c}" viewBox="0 0 12 12">${KI[k]}</svg>`;

function scene(o={}){
  const {x=0,y=0,cls='',f='',extra='',sun=false,clouds=false}=o;
  return `<div class="scene ${cls}" style="--x:${x};--y:${y};${f?`filter:${f};`:''}"><div class="in"><i class="sk"></i>${sun?'<i class="sun"></i>':''}${clouds?'<i class="cl c1"></i><i class="cl c2"></i><i class="cl c3"></i>':''}<i class="m1"></i><i class="m2"></i><i class="g"></i></div>${extra}</div>`;
}
/* 26 Drohnen-Fotos: 8 Richtungen × 3 Reihen + 2 steil nach unten */
const ROWS=['+13°','−17°','−47°'];
function droneShot(i){ if(i>=24) return {nadir:true,label:`−75° · ${i-23}`}; const r=Math.floor(i/8), d=i%8; return {x:d/7,y:[0,.45,.9][r],label:`R${r+1} · ${d*45}°`}; }
function droneScene(i){ const s=droneShot(i); return s.nadir?scene({cls:'nadir'}):scene({cls:'w',x:s.x,y:s.y}); }

/* ---------- Hauptfenster: Bausteine ---------- */
const LIB_NORMAL='<span class="ic">&#xE8F1;</span><div><b>Familienfotos</b><small>Bibliothek wechseln</small></div>';
const LIB_HIDDEN='<span class="ic">&#xE72E;</span><div><b>Privat</b><small>versteckte Bibliothek · X:</small></div>';
function fcard({serOn=false,cond='<span class="cond">alle Fotos</span>',count='5 212 Dateien',neu='12'}={}){
  return `<div class="fcard">
   <div class="frow"><span class="lbl">DATEI</span><span class="chip">Alle</span><span class="chip"><span class="ic s">&#xEB9F;</span>Bilder</span><span class="chip"><span class="ic s">&#xEB52;</span>Nur Favoriten</span><span class="chip">Bewertung: egal</span><span class="chip">Ablage: Überall</span></div>
   <div class="frow"><span class="lbl">INHALT</span><span class="chip">Tags</span><span class="chip">Personen</span><span class="chip">Motive</span><span class="chip">Ort</span><span class="chip">Tour</span><span class="chip">Doppelte</span>
     <span class="chip ${serOn?'on':''}" data-go="filter:fly">${ki('stack')}Serien <span class="new">${neu} neu</span> ▾</span><span class="chip">Lieblinge</span></div>
   <div class="active-row">Es gilt: ${cond}<span style="margin-left:auto">${count}</span></div></div>`;
}
const ghead=(crumb='')=>`<div class="ghead"><h1>Galerie</h1><div class="crumb">${crumb}</div></div>`;
const dayh=(t,s='')=>`<div class="dayh">${t}<small>${s}</small></div>`;
function tile(o={}){
  const bg=o.scene||PH(o.i||0);
  return `<div class="tile ${o.sel?'sel':''} ${o.dim?'dim':''}"${o.attr||''}><div class="bg"${o.f?` style="filter:${o.f}"`:''}>${bg}</div>
    ${o.smk?`<span class="smk">${o.smk}</span>`:''}${o.dot?'<span class="sdot"></span>':''}${o.rmk?`<span class="rmk">${o.rmk}</span>`:''}
    ${o.pair?`<span class="pair">${o.pair}</span>`:''}${o.vlen?`<span class="vlen"><span class="ic s">&#xE714;</span>${o.vlen}</span>`:''}
    ${o.chk!==undefined?`<span class="tchk ${o.chk?'on':''}">&#xE73E;</span>`:''}${o.tip||''}</div>`;
}
function stile(o){
  return `<div class="stile ${o.hov?'hov':''}"><div class="cv"><div class="bg">${o.cover}</div>
     ${o.neu?'<span class="neu">neu</span>':''}${o.cloud?`<span class="cloud"><span class="ic s">&#xE753;</span>${o.cloud}</span>`:''}
     ${o.hov?`<span class="oneclick"><span>${ki(o.k)}${o.btn}</span><span>▾</span></span>`:''}</div>
     <div class="meta"><b>${ki(o.k)}${o.t}</b>${o.n}</div></div>`;
}
const SB=(info,act)=>`<span><span class="ic s">&#xE8F1;</span> Familienfotos</span><span>${info}</span><div class="act">${act}</div>`;
const ACT_SERIES='<span class="spin"></span><span>Serien erkennen · 12 400 / 48 000</span><span class="mini"><i style="width:26%"></i></span>';

/* Serien-Kacheln (eine Kachel je Serie) */
function seriesTiles(hov=true){
  return dayh('Sa, 14. Juni 2025','3 Serien')+
   stile({k:'pano',t:'Panorama · Kugel 360°',n:'26 Fotos · 51 s',neu:true,hov,btn:'Panorama 360° zusammenfügen',cover:scene({cls:'w',x:.15,y:.3})})+
   stile({k:'pano',t:'Panorama · Zylinder',n:'21 Fotos · 38 s',neu:true,cover:scene({cls:'w',x:.5,y:.35,sun:true})})+

   stile({k:'pano',t:'Panorama · Kugel 360°',n:'26 Fotos · 49 s',cloud:'3 nur in OneDrive',cover:scene({cls:'w',x:.3,y:.4})})+
   stile({k:'pano',t:'Panorama · Vertikal',n:'3 Fotos · 5 s',cover:scene({cls:'w',x:.65,y:.1})})+
   stile({k:'pano',t:'Panorama · Automatisch',n:'14 Fotos · 30 s · kein sicherer Vorschlag',cover:scene({cls:'w',x:.9,y:.5,sun:true})})+
   stile({k:'pano',t:'Panorama · Zylinder',n:'21 Fotos · 40 s',cover:scene({cls:'w',x:.05,y:.25,clouds:true})});
}

/* ---------- Fenster „Zusammenfügen“: Bausteine ---------- */
const METHODS=[
 {k:'pano',n:'Panorama',i:'pano',st:1,go:'pano:kugel'},
 {k:'hdr',n:'Belichtungsreihe (HDR)',i:'hdr',st:4,go:'hdr:nat'},
 {k:'denoise',n:'Entrauschen / mehr Details',i:'denoise',st:4,go:'burst:denoise'},
 {k:'people',n:'Leute entfernen',i:'people',st:4,go:'burst:people'},
 {k:'long',n:'Langzeitbelichtung',i:'long',st:4,go:'burst:long'},
 {k:'focus',n:'Fokus-Stapel',i:'focus',st:5,go:'focus'},
 {k:'tl',n:'Zeitraffer',i:'interval',st:5,go:'tl'},
 {k:'hdrpano',n:'HDR-Panorama',i:'panohdr',st:5,go:'pano:hdrpano'},

const NO=r=>['no',r];
const FIT={
 pano:{pano:['ok','überlappend ≈ 35 % · Gimbal 8 × 3 + 2'],hdr:NO('Belichtung überall gleich'),denoise:NO('Kamera schwenkt'),people:NO('Kamera schwenkt'),long:NO('Kamera schwenkt'),focus:NO('Fokus überall gleich'),tl:NO('kein gleichmäßiger Abstand'),hdrpano:NO('keine Belichtungsstufen'),group:NO('keine Gesichter')},
 hdrpano:{pano:['ok','geht auch: nur mittlere Belichtung'],hdr:NO('Kamera schwenkt'),denoise:NO('Kamera schwenkt'),people:NO('Kamera schwenkt'),long:NO('Kamera schwenkt'),focus:NO('Fokus überall gleich'),tl:NO('kein gleichmäßiger Abstand'),hdrpano:['ok','26 Positionen × 3 Belichtungen'],group:NO('keine Gesichter')},
 hdr:{pano:NO('gleicher Bildausschnitt'),hdr:['ok','5 Stufen · −2 … +2 EV'],denoise:NO('Belichtung gestuft'),people:NO('nur 1,2 s'),long:NO('Belichtung gestuft'),focus:NO('Fokus gleich'),tl:NO('nur 5 Fotos'),hdrpano:NO('kein Schwenk'),group:NO('keine Gesichter')},
 burst:{pano:NO('Kamera steht'),hdr:NO('Belichtung überall gleich'),denoise:['ok','ISO 1600 · 16 Fotos'],people:['ok','16 Fotos über 24 s'],long:['ok','Kamera steht'],focus:NO('Fokus gleich'),tl:NO('nur 16 Fotos'),hdrpano:NO('kein Schwenk'),group:NO('keine Gesichter')},
 focus:{pano:NO('Kamera steht'),hdr:NO('Belichtung gleich'),denoise:NO('Fokus wandert'),people:NO('nur 6 s'),long:NO('Fokus wandert'),focus:['ok','Fokus 0,21 → 0,34 m'],tl:NO('nur 8 Fotos'),hdrpano:NO('kein Schwenk'),group:NO('keine Gesichter')},
 group:{pano:NO('Kamera steht'),hdr:NO('Belichtung gleich'),denoise:NO('ISO 200 · kaum Rauschen'),people:NO('Personen sind das Motiv'),long:NO('Personen bewegen sich'),focus:NO('Fokus gleich'),tl:NO('nur 6 Fotos'),hdrpano:NO('kein Schwenk'),group:['ok','5 Gesichter je Foto']},
 tl:{pano:NO('Kamera steht'),hdr:NO('Belichtung gleich'),denoise:NO('Licht wechselt (40 min)'),people:NO('Licht wechselt'),long:['ok','Kamera steht · nur Ausschnitt'],focus:NO('Fokus gleich'),tl:['ok','480 Fotos · alle 5 s'],hdrpano:NO('kein Schwenk'),group:NO('keine Gesichter')}};
FIT.one=Object.fromEntries(METHODS.map(m=>[m.k,NO('nur 1 Foto angehakt')]));

function mleft(o){
  return `<div class="mleft ${o.lock?'locked':''}"><div class="srcinfo">${o.src}</div><h4>Verfahren</h4>
   ${METHODS.map(m=>{const f=FIT[o.fit][m.k]; const later=o.stufe1&&m.k!=='pano';
     return `<div class="meth ${m.k===o.sel?'on':''} ${f[0]==='no'?'no':''} ${later?'later':''}" data-go="${m.go}"><span class="mic">${ki(m.i)}</span><div><b>${m.n}${m.k===o.sugg?'<span class="sg">Vorschlag</span>':''}</b><small>${later?'kommt in Stufe '+m.st:f[1]}</small></div><span class="fit ${later?'later':f[0]}">${later?'kommt später':(f[0]==='ok'?'passt':'eher nicht')}</span></div>`;}).join('')}
   <div class="why"><h5><span class="ic s">&#xE946;</span>${o.whyTitle||'Warum dieser Vorschlag'}</h5><ul>${o.why.map(w=>`<li>${w}</li>`).join('')}</ul></div></div>`;
}
const sbarHtml=(toggles,mid,zoom=true)=>`<div class="sbar">${toggles.map(t=>`<span class="tg ${t[1]?'on':''}">${t[0]}</span>`).join('')}<span class="mid">${mid}</span>${zoom?'<span class="zm"><span>−</span><span>Einpassen</span><span>+</span></span>':''}</div>`;
const PRIO='<span class="pr">Vorrang</span>';

function seamsSvg(){
  let p=''; for(let i=1;i<8;i++){const x=i*12.5; p+=`<path d="M${x} 0C${x+1.6} 20 ${x-1.6} 40 ${x} 50S${x+1.6} 80 ${x} 100"/>`;}
  p+='<path d="M0 38C20 36 40 40 60 37S85 39 100 38"/><path d="M0 64C25 66 50 62 75 65S90 63 100 64"/>';
  return `<svg class="seams" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".35" stroke-dasharray="1.2 1">${p}</svg>`;
}
function panoStage(p,{seams=false,label='',hdr=false}={}){
  const P=PROJ[p];
  return `<div class="cbox" style="width:${P.w}px;height:${P.h}px">
    <div class="cimg" style="${P.clip?`clip-path:${P.clip};`:''}">${scene({sun:true,clouds:true,f:hdr?'contrast(1.08) saturate(1.15)':''})}
      ${P.gaps?'<div class="gaps" style="top:0;height:11%">Zenit · Lücke wird gefüllt (weicher Verlauf)</div><div class="gaps" style="bottom:0;height:11%">Nadir · Lücke wird gefüllt</div>':''}
      ${seams?seamsSvg():''}</div>
    ${P.crop?`<div class="crop" style="inset:${P.crop}"></div>`:''}
    <div class="clbl">${label}</div></div>`;
}
function projSketch(k){
  if(k==='auto') return '<i class="auto">A</i>';
  const P=PROJ[k]; const s=Math.min(60/P.w,28/P.h); const w=Math.round(P.w*s), h=Math.round(P.h*s);
  return `<i style="width:${w}px;height:${h}px;${P.clip?`clip-path:${P.clip};`:''}"></i>`;
}
function projTiles(cur,sugg='kugel'){
  const L=[['auto','Automatisch','übernimmt den Vorschlag'],...['kugel','zyl','persp','vert','shift'].map(k=>[k,PROJ[k].n,PROJ[k].s])];
  return `<div class="projs">${L.map(([k,n,s])=>`<button class="proj ${k===cur?'on':''}" data-proj="${k}"><span class="psk">${projSketch(k)}</span><b>${n}</b><small>${s}</small>${k===sugg?'<span class="sg">Vorschlag</span>':''}</button>`).join('')}</div>`;
}

    single=false; tiles=[dayh('Sa, 21. Juni 2025','Weitwinkel 3 × 3')]; for(let i=0;i<9;i++) tiles.push(tile({scene:scene({cls:'w',x:(i%3)/2,y:Math.floor(i/3)*.45}),sel:true}));

  }
  const L=470, T=200;
  if(s==='mark'){
    menus=menuHtml([['<svg class="ki" viewBox="0 0 12 12">'+KI.merge+'</svg>','Serie mit 26 Fotos zusammenfügen…','','new'],['&#xE8A7;','Fotos der Serie zeigen',''],'-',['&#xE711;','Keine Serie','']],L+20,T+40,280)

        : s==='lb' ? [ki('merge'),'Zusammenfügen…','neu','new']

      const enh = (s==='series'||s==='lb') ? 'Foto verbessern…' : (s==='album'?'9':s==='off'?'6':'5')+' Fotos verbessern…';
      sub=[['&#xE787;','Datum setzen…'],['&#xE707;','Ort setzen…'],'-',['&#xE7AD;','Nach links drehen'],['&#xE7AD;','Nach rechts drehen'],'-',['&#xE945;',enh],merge,...(s==='multi'||s==='list'?[[ki('stack'),'Zur Serie hinzufügen','▸']]:[])];

    if(s==='lb') menus+=`<div class="tip" style="left:${m.subLeft+10}px;top:${m.subTop+222}px">Ein Foto ohne Serie: das Fenster zeigt die Zeit-Nachbarn<br>(gleicher Ordner, gleiche Kamera, ± 2 min) — noch nicht angehakt.<br><span class="link" data-go="menu:nb">Fenster ansehen ›</span></div>`;
  }
  if(body) return body+menus;
  return head+fc+abar+`<div class="gal" style="--cols:6">${tiles.join('')}</div>`+menus;
};

function hintDlg(title,body,btns){ return `<div class="smoke"><div class="dlg" style="width:560px"><div class="in"><h2>${title}</h2>${body}</div><div class="ft">${btns}</div></div></div>`; }
function hintWin(s){
  const w=panoWin('kugel');
  if(s==='cloud') return {...w,body:w.body+hintDlg('Fotos nur in OneDrive','<div>5 von 26 Fotos liegen nur in OneDrive (≈ 120 MB). Zum Zusammenfügen braucht Lumora die Pixel.</div><div class="muted">Die Serien-Erkennung lädt nie herunter; das passiert nur hier, nach Bestätigung. Nicht erreichbare Dateien auf Offline-Laufwerken werden genannt, nie als „fehlt“ gewertet.</div>','<button class="btn-std">Abbrechen</button><button class="btn-std">Ohne diese Fotos</button><button class="btn-acc">Herunterladen und fortfahren</button>')};
  if(s==='part') return {...w,body:w.body+hintDlg('Teil einer Serie','<div>Diese 8 Fotos gehören zu einer Serie mit 26 Fotos — alle 26 nehmen?</div><div class="muted">Panorama · Kugel 360° · DJI-Panorama-Ordner</div>','<button class="btn-std">Nur die 8</button><button class="btn-acc">Alle 26 nehmen</button>')};
  if(s==='multi') return {...w,body:w.body+hintDlg('Mehrere Serien','<div>Die Auswahl enthält 2 Serien (26 + 21 Fotos) — getrennt zusammenfügen oder als ein Bild?</div><div class="muted">Getrennt: 2 Ergebnisse, jedes einzeln rückgängig.</div>','<button class="btn-std">Als ein Bild</button><button class="btn-acc">Getrennt (2 Ergebnisse)</button>')};
  const strip = s==='raw' ? '<div class="wstrip"><span class="ic s">&#xE7BA;</span>RAW nur als eingebettete Vorschau (960 × 640): die Raw-Bilderweiterung fehlt. Lumora nimmt die JPEG-Geschwister.<span class="lk">Im Microsoft Store zeigen</span></div>'
    : s==='mem' ? '<div class="wstrip"><span class="ic s">&#xE7BA;</span>„Voll“ (≈ 30 000 × 15 000, 450 MP) braucht ≈ 12 GB Arbeitsspeicher, frei sind 9 GB. 16K (134 MP) ist gewählt.<span class="lk">Speicher freigeben und neu prüfen</span></div>'
    : '<div class="wstrip bad"><span class="ic s">&#xE783;</span>Die Auswahl stammt aus 2 Bibliotheken („Alle verknüpften“). Zusammenfügen geht nur innerhalb einer Bibliothek.<span class="lk">Nur „Familienfotos“ nehmen</span></div>';
  return {...w,body:w.body.replace('<div class="mcenter"><div></div>','<div class="mcenter">'+strip)};
}

 group:'<b>Ansicht 9 · Bestes Gruppenfoto</b> (Punkt 5, Stufe 6, zuletzt). Grundbild mit nummerierten Gesichtsrahmen; darunter je Person eine Leiste mit dem Gesicht aus jedem Foto, Marken „Vorschlag“, „unscharf“, „abgewandt“, „Augen zu“ (nur mit dem Landmarken-Modell 2d106det aus „Modelle & Daten“). Klick tauscht; getauscht wird nur dieselbe Person, unsichere Zuordnung (gelb) bleibt. Nutzt die vorhandene Gesichtserkennung (ADR-0035/0036), fehlende Gesichter mit Vorrang. Gesichter sind neutrale Kreise, Namen erfunden.',
 tl:'<b>Ansicht 10 · Zeitraffer</b> (Punkt 5, Stufe 5). Abspielfläche aus den Vorschaubildern mit Play/Pause und Zeitleiste, Bilder je s mit Länge, 1080p/4K, Ausschnitt 16 : 9, Ausrichten, Flimmern ausgleichen, Zustand von FFmpeg. Ergebnis ist ein Video in der Bibliothek; Hochskalieren gibt es dafür nicht.',
 save:'<b>Ansicht 11 · Speichern → Rechnen → Fertig</b> (Punkte 7, 8, 10, 12) — hier aus dem Album „Ausflüge“ gestartet, deshalb im Fuß „auch ins Album „Ausflüge““ gesetzt (Verknüpfung über <span class="mono">IAlbumService.AddFilesAsync</span>, ADR-0054). <b>Vor dem Speichern</b>: Schätzung von Größe, Zeit, Arbeitsspeicher und Platz; volle Auflösung aus dem Rezept, keine zweite Ausrichtung. <b>Rechnet</b>: Schrittliste, Restzeit, Vorrang vom Klick auf „Speichern“ bis zum Eintrag im Katalog (nicht für die Lebensdauer des Fensters); „Im Hintergrund weiterrechnen“ gibt den Vorrang zurück, schließt das Fenster und rechnet mit halben Kernen weiter. <b>Fertig</b>: Ergebnis als neue Datei neben dem ersten Einzelbild, Kennzeichnung „aus 26 Fotos zusammengefügt“, Datum/Ort/Kamera vom ersten Bild, gemeinsame Tags, keine Sterne; Öffnen, In der Galerie zeigen, Rückgängig (Papierkorb + Verknüpfungen), Danach verbessern… (öffnet „Foto verbessern“ mit dem Ergebnis).',
 batch:'<b>Ansicht 12 · Stapel</b> (Punkt 12, Stufe 2). Aus dem Flyout „Alle n sichtbaren zusammenfügen…“ (die Zahl folgt dem Filter, hier Kugel 360° offen → 48) oder mehreren gewählten Serien-Kacheln: Anzahl, Verfahren und Aufnahmeart je Gruppe (aus dem Vorschlag, umstellbar), Größe, Zeit-, Platz- und Speicherschätzung, Hinweis „ohne Einzelvorschau“ (bewusste Ausnahme, offener Punkt bei der Abnahme), OneDrive-Platzhalter, Nebenbei (Standard ab 3 Serien) oder Mit Vorrang. Jedes Ergebnis wird sofort in einem eigenen Batch gespeichert; „Rückgängig“ am Vorgang nimmt alle zurück. Nebenbei wartet der Stapel, solange ein Zusammenfügen mit Vorrang rechnet (ein schwerer Lauf zur Zeit, Ansicht 13).',
 act:'<b>Ansicht 13 · Aktivitäts-Anzeige</b> (Punkte 4 und 12, ADR-0067/0074). <b>Speichern läuft</b>: „Panorama zusammenfügen · 26 Fotos · Überblenden (5/6) · noch ≈ 2 min · Vorrang“ ist der <b>einzige</b> laufende Vorgang. Alles andere steht unter „Wartet — Vorrang für „Zusammenfügen““: der Stapel „Zusammenfügen · 12 / 48“ (ein Vorgang mit Pause; <span class="mono">OpenCvRuntime</span> lässt nur einen schweren Lauf zur Zeit zu), Serien erkennen (Vorrang 3), Prüfsummen (4) und Vorschaubilder auf Vorrat (5). Zuletzt fertig: ein früherer Stapel „39 Panoramen gespeichert“ (Zylinder) mit Ergebnisse zeigen, Rückgängig, Details (übersprungene). <b>Vorschau</b>: eigener Vorgang mit Abbrechen, nicht unter „Zuletzt fertig“; der Hintergrund wartet nur, solange gerechnet wird (2 s Nachlauf), nicht solange das Fenster offen ist. <b>Fertig-Meldung</b>: „Panorama gespeichert“ mit Öffnen und Rückgängig. Die Galerie dahinter ist ohne Serien-Filter.',
 lb:'<b>Ansicht 14 · Lightbox mit Ergebnis</b> (Punkt 10). Über die Ergebnis-Marke geöffnet: Ergebnis zuerst, dahinter die Quellen im Filmstreifen. Zeile „Zusammengefügt aus 26 Fotos · Panorama, Kugel 360° · Quellen zeigen · Neu berechnen…“ („Neu berechnen“ öffnet das Fenster mit dem gespeicherten Rezept und speichert als weitere Datei). Info-Abschnitt „Zusammengefügt“ (Verfahren, Aufnahmeart, Größe, Quelle, Quellenzahl, davon nicht mehr vorhanden). Kugel 360° vorerst flach in 2 : 1; die Rundum-Ansicht ist Ausblick.',
 set:'<b>Ansicht 15 · Einstellungen › Zusammenfügen</b> (Punkte 4, 12, 17), neuer Reiter nach „Verbessern“. Serien erkennen an/aus (still, Datei-Spur Vorrang 3, wartet, sobald du wartest), Arten, Zeitlücke Serienbild (2 s) und Panorama (15 s), mindestens 3 Fotos, Verworfene zeigen, Stand und „Serien neu erkennen“ (Benutzerzustand bleibt); Standard-Arten je Verfahren; Ergebnis (Ablage, Drohnen-Ordner eine Ebene höher, Dateinamen-Zusätze, JPEG 92, TIFF 16 bit, gemeinsame Tags, Quellen einklappen); Rechnen (Stapel nebenbei ab 3; Vorrang nur, solange Vorschau oder Speichern rechnen); Werkzeuge (OpenCV, Raw-Bilderweiterung, FFmpeg, Hugin nur falls Spike 20 es vorsieht).',
 hint:'<b>Ansicht 16 · Hinweise</b> (Punkte 7, 8, 14). <b>OneDrive</b>: Zusammenfügen braucht die Pixel — fragt vor dem Herunterladen („Ohne diese Fotos“ geht auch). <b>RAW nur Vorschau</b>: ohne Raw-Bilderweiterung liefert Windows nur 960 × 640, Lumora nimmt die JPEG-Geschwister. <b>Speicher</b>: „Voll“ ausgegraut mit Zahl, 16K bleibt. <b>Bibliotheken gemischt</b>: gesperrt (ADR-0048). <b>Teil einer Serie</b> und <b>mehrere Serien</b>: Rückfrage beim Start.',
 hidden:'<b>Ansicht 17 · Versteckte Sitzung</b> (Punkt 13, ADR-0049). Alles funktioniert gleich — Serien, Ein-Klick, Fenster, Stapel — mit den eigenen Zahlen der versteckten Bibliothek (7 Serien, 74 Fotos, 3 neu; keine OneDrive-Marke, der Container ist ein eingehängtes Laufwerk ohne Platzhalter) und bleibt im Container: Katalog, Dateiköpfe, Verknüpfungen, Zwischenstände (Temp im Container, beim Schließen gelöscht), Probe-Vorschauen, Ergebnis neben der ersten Quelle. OpenCL aus (kein Kernel-Cache außerhalb), FFmpeg mit TEMP im Container und ohne Bericht, Protokoll nur mit Verfahren und Id. In der Fertig-Ansicht (hier das Zylinder-Panorama aus 21 Fotos) ist „Im Explorer zeigen“ gesperrt; ein externes Werkzeug (Hugin) bliebe gesperrt, bis belegt ist, dass es nichts außerhalb schreibt.'};

let cur='marks', SUB={};
VIEWS.forEach(v=>{ if(v[3]) SUB[v[1]]=v[3][v[1]==='pano'?1:0][0]; });
SUB.save='before';

function renderBar(){
  const grp={g:'Galerie:',w:'Fenster:',x:'Weiteres:'}; let h='';
  ['g','w','x'].forEach(g=>{ h+=`<span style="margin-left:${g==='g'?0:8}px;color:#AAB">${grp[g]}</span>`+VIEWS.filter(v=>v[0]===g).map(v=>`<button data-v="${v[1]}" class="${v[1]===cur?'on':''}">${v[2]}</button>`).join(''); });
  $('#vbar').innerHTML=h;
  const v=VIEWS.find(x=>x[1]===cur);
  $('#sbar2').innerHTML = v[3] ? 'Zustand: '+v[3].map(([k,n])=>`<button data-sub="${k}" class="${SUB[cur]===k?'on':''}">${n}</button>`).join('') : '<span>Ansicht ohne weitere Zustände</span>';
}
function show(view,sub){
  cur=view; if(sub) SUB[view]=sub; const s=SUB[view];
  const isWin = (WIN[view] && !(view==='hint'&&s==='mixed')) || (view==='hidden'&&s==='done') || (view==='menu'&&s==='nb');
  $('#win').classList.toggle('hidden',isWin); $('#mwin').classList.toggle('hidden',!isWin);
  if(isWin){
    const w = view==='hidden' ? doneWin(true) : view==='menu' ? nbWin() : WIN[view](s);
    $('#mwTitle').innerHTML = w.title + (view==='hidden'?' <span class="lock"><span class="ic s">&#xE72E;</span>versteckte Sitzung</span>':'');
    $('#mbody').innerHTML=w.body; $('#mfoot').innerHTML=w.foot;
  } else {
    const hidden=view==='hidden';
    $('#lib').innerHTML = hidden?LIB_HIDDEN:LIB_NORMAL;
    $$('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.nav===(view==='set'?'set':(view==='menu'&&s==='album'?'alb':'gal'))));
    const c=$('#content'); c.classList.toggle('scroll',view==='set');
    let sbInfo='212 von 5 212 Fotos', act=ACT_IDLE, extra='';
    if(view==='hint'){ c.innerHTML=V.menu('off'); sbInfo='6 ausgewählt'; }
    else c.innerHTML=V[view](s);
    if(view==='marks'||view==='filter'||view==='series') act=ACT_SERIES;
    if(view==='act'){ const a=actStatus(s); act=a.act; extra=a.fly; }
    if(view==='batch') act=ACT_SERIES;
    $('#sb').innerHTML = hidden ? `<span><span class="ic s">&#xE72E;</span> Privat · versteckte Bibliothek</span><span>7 Serien · 3 neu</span><div class="act">${ACT_IDLE}</div>` : SB(sbInfo,act)+extra;
  }
  $('#cap').innerHTML = CAP[view] + (view==='hint'&&s==='mixed' ? ' <i>(Zustand „Bibliotheken gemischt“ zeigt den gesperrten Menüeintrag aus Ansicht 4.)</i>' : '');
  renderBar();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(b){ show(b.dataset.v); return; }
  const sb=e.target.closest('[data-sub]'); if(sb){ show(cur,sb.dataset.sub); return; }
  const p=e.target.closest('[data-proj]'); if(p){ show('pano',p.dataset.proj); return; }
  const g=e.target.closest('[data-go]'); if(g){ const [v,s]=g.dataset.go.split(':'); show(v,s); }
});
function fit(){ const w=1280,h=800; const s=Math.min(1,(document.documentElement.clientWidth-40)/w);
  ['#win','#mwin'].forEach(id=>{ const el=$(id); el.style.width=w+'px'; el.style.height=h+'px'; el.style.transform=`scale(${s})`; });
  $('#winBox').style.width=w*s+'px'; $('#winBox').style.height=h*s+'px'; $('#cap').style.maxWidth=w*s+'px'; }
function theme(d){ document.body.classList.toggle('dark',d); $('#mbLight').classList.toggle('on',!d); $('#mbDark').classList.toggle('on',d); }
$('#mbLight').onclick=()=>theme(false); $('#mbDark').onclick=()=>theme(true);
window.addEventListener('resize',fit); fit(); theme(window.matchMedia('(prefers-color-scheme: dark)').matches); show('marks');
</script>
</body>
</html>
