<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora — Galerie mit Ordnerleiste (Entwurf 18)</title>
<style>
/* =====================================================================
   Mockup 18 · Galerie mit Ordnerleiste. Tokens 1:1 aus 08–17.
   Galerie und Ordner werden eine Ansicht: links eine ein-/ausklappbare Ordnerleiste (heutiger Ordnerbaum mit allen
   Aktionen, Ausschlüssen, Tag-/Kategorie-Zahlen), rechts die Galerie. Ordner wirkt als Filter-Chip und ist mit den
   übrigen Filtern kombinierbar. Der Menüpunkt „Ordner“ links entfällt. Namen erfunden. Hell/Dunkel über „dark“.
   ABGENOMMEN von Herbert am 2026-10-25: alle fünf Ansichten (Leiste offen, Ordner + Filter, Rechtsklick Ordner mit den
   neuen Einträgen, Fotos auf Ordner ziehen, Leiste zu mit Strg+B). Korrektur: Ziehen auf einen Ordner folgt der
   bestehenden Regel (ohne Taste verknüpfen, Umschalt verschieben, ADR-0054), nicht „verschiebt immer“.
   ===================================================================== */
:root {
  --mica-base:#F3F3F3; --layer-default:rgba(255,255,255,0.7); --layer-card:#FFFFFF; --layer-subtle:rgba(0,0,0,0.026);
  --layer-secondary:rgba(0,0,0,0.04); --layer-tertiary:rgba(0,0,0,0.06);
  --text-primary:#1A1A1A; --text-secondary:#5C5C5C; --text-tertiary:#8B8B8B; --text-on-accent:#FFFFFF;
  --stroke-default:rgba(0,0,0,0.0578); --stroke-divider:rgba(0,0,0,0.0803); --stroke-card:rgba(0,0,0,0.0578); --ctl-bottom:rgba(0,0,0,0.16);
  --accent:#5B5FC7; --accent-light:#7579D8; --accent-dark:#4145A0; --accent-soft:rgba(91,95,199,0.08); --accent-soft-2:rgba(91,95,199,0.16);
  --success:#107C10; --success-soft:rgba(16,124,16,0.10); --warning:#C29C00; --warning-soft:rgba(194,156,0,0.14); --danger:#C42B1C;
  --shadow-card:0 2px 4px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03); --shadow-flyout:0 8px 16px rgba(0,0,0,0.14);
  --brand-indigo:#5B5FC7; --brand-violet:#8B5CF6; --brand-coral:#F97362; --brand-amber:#F5A524;
  --page-bg:#E4E4EA; --smoke:rgba(0,0,0,0.3);
}
body.dark {
  color-scheme:dark;
  --mica-base:#202020; --layer-default:rgba(43,43,43,0.7); --layer-card:#2C2C2C; --layer-subtle:rgba(255,255,255,0.03);
  --layer-secondary:rgba(255,255,255,0.0418); --layer-tertiary:rgba(255,255,255,0.0605);
  --text-primary:#FFFFFF; --text-secondary:#D0D0D0; --text-tertiary:#A0A0A0;
  --stroke-default:rgba(255,255,255,0.0837); --stroke-divider:rgba(255,255,255,0.0837); --stroke-card:rgba(255,255,255,0.0578); --ctl-bottom:rgba(255,255,255,0.22);
  --accent:#818CF8; --accent-light:#A5B0FF; --accent-dark:#6066D8; --accent-soft:rgba(129,140,248,0.12); --accent-soft-2:rgba(129,140,248,0.24);
  --success:#6CCB5F; --success-soft:rgba(108,203,95,0.12); --warning:#FCE100; --warning-soft:rgba(252,225,0,0.14); --danger:#FF6B5E;
  --shadow-card:0 2px 4px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.22); --shadow-flyout:0 8px 16px rgba(0,0,0,0.4);
  --brand-indigo:#818CF8; --brand-violet:#A78BFA; --brand-coral:#FB8A7A; --brand-amber:#FBBF24;
  --page-bg:#121214; --smoke:rgba(0,0,0,0.55);
}
* { box-sizing:border-box; } html,body { margin:0; }
body { background:var(--page-bg); color:var(--text-primary); font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; font-size:14px; }
button { font:inherit; color:inherit; }
.ic { font-family:'Segoe Fluent Icons','Segoe MDL2 Assets'; font-size:16px; line-height:1; font-style:normal; }
.ic.s { font-size:12px; }
.hidden { display:none !important; }
.mock-bar { position:sticky; top:0; z-index:100; display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:7px 20px; background:#2B2B33; color:#EEE; font-size:12px; }
.mock-bar .grp { display:flex; gap:4px; align-items:center; }
.mock-bar button { background:#44444F; color:#EEE; border:1px solid #5A5A66; border-radius:4px; padding:3px 9px; cursor:pointer; font-size:12px; }
.mock-bar button.on { background:#5B5FC7; border-color:#7579D8; }
.mock-bar .note { margin-left:auto; color:#AAB; }
.stage-wrap { padding:16px 20px 32px; display:flex; justify-content:center; }
.win-box { position:relative; flex:none; }
.window { position:absolute; left:0; top:0; transform-origin:0 0; background:var(--mica-base); border-radius:8px; border:1px solid var(--stroke-default);
  box-shadow:0 16px 48px rgba(0,0,0,0.22); overflow:hidden; display:grid; grid-template-columns:232px 1fr; grid-template-rows:36px 1fr 30px; }
.titlebar { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding-left:14px; font-size:12px; color:var(--text-secondary); }
.titlebar .tile { width:16px; height:16px; border-radius:4px; background:linear-gradient(135deg,#6366F1,#4145A0); }
.titlebar .wc { margin-left:auto; display:flex; height:100%; } .titlebar .wc span { width:46px; display:grid; place-items:center; font-family:'Segoe Fluent Icons'; font-size:10px; color:var(--text-primary); }
.nav { padding:2px 8px 10px; display:flex; flex-direction:column; gap:2px; }
.wbs { font-family:'Segoe UI Variable Display','Segoe UI',sans-serif; font-size:22px; padding:2px 12px 10px;
  background:linear-gradient(100deg,var(--brand-indigo),var(--brand-violet) 45%,var(--brand-coral) 75%,var(--brand-amber)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lib-switch { margin:0 2px 8px; padding:8px 10px; border-radius:6px; background:var(--layer-card); border:1px solid var(--stroke-card); box-shadow:var(--shadow-card); display:flex; gap:10px; align-items:center; }
.lib-switch b { display:block; font-weight:600; } .lib-switch small { display:block; color:var(--text-tertiary); font-size:11px; }
.nav-item { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:4px; position:relative; white-space:nowrap; }
.nav-item.active { background:var(--layer-secondary); }
.nav-item.active::before { content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:2px; background:var(--accent); }
.nav .spacer { flex:1; }
.content { position:relative; min-width:0; min-height:0; background:var(--layer-default); border-top-left-radius:8px; border-left:1px solid var(--stroke-default); border-top:1px solid var(--stroke-default); overflow:auto; }
.statusbar { grid-column:1/-1; display:flex; align-items:center; gap:18px; padding:0 14px; font-size:12px; color:var(--text-secondary); border-top:1px solid var(--stroke-divider); background:var(--mica-base); }
.statusbar .r { margin-left:auto; display:flex; gap:10px; align-items:center; }
.btn-acc { background:var(--accent); color:var(--text-on-accent); border:1px solid transparent; border-radius:4px; padding:5px 14px; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; white-space:nowrap; }
body.dark .btn-acc { color:#111; } .btn-acc:hover { background:var(--accent-light); }
.btn-std { background:var(--layer-card); border:1px solid var(--stroke-divider); border-bottom-color:var(--ctl-bottom); border-radius:4px; padding:5px 12px; font-size:13px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; white-space:nowrap; }
.btn-std:hover { background:var(--layer-subtle); }
.btn-std.danger { color:var(--danger); }
.phead { padding:18px 24px 6px; } .phead h1 { font-size:28px; font-weight:600; margin:0; }
.tabs { display:flex; gap:4px; padding:4px 24px 10px; border-bottom:1px solid var(--stroke-divider); flex-wrap:wrap; }
.tabs span { padding:6px 12px; border-radius:4px; color:var(--text-secondary); }
.tabs span.on { color:var(--text-primary); font-weight:600; box-shadow:inset 0 -3px 0 var(--accent); }
.body { padding:14px 24px 24px; display:grid; gap:12px; max-width:960px; }
.card { background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; box-shadow:var(--shadow-card); padding:14px 16px; }
.card h2 { font-size:15px; margin:0 0 4px; display:flex; gap:10px; align-items:center; }
.muted { color:var(--text-secondary); font-size:12px; line-height:1.5; }
.opt { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--stroke-divider); }
.opt:first-of-type { border-top:0; }
.opt b { font-weight:600; font-size:13px; display:block; }
.sw { width:40px; height:20px; border-radius:10px; border:1px solid var(--text-secondary); position:relative; flex:none; cursor:pointer; display:inline-block; }
.sw::after { content:''; position:absolute; top:4px; left:4px; width:10px; height:10px; border-radius:50%; background:var(--text-secondary); transition:left .12s; }
.sw.on { background:var(--accent); border-color:var(--accent); } .sw.on::after { left:24px; background:#fff; }
.chk { width:16px; height:16px; border-radius:3px; border:1px solid var(--text-secondary); display:inline-grid; place-items:center; flex:none; font-family:'Segoe Fluent Icons'; font-size:10px; color:transparent; cursor:pointer; }
.chk.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.app { border:1px solid var(--stroke-card); border-radius:8px; background:var(--layer-card); box-shadow:var(--shadow-card); overflow:hidden; }
.app-h { display:grid; grid-template-columns:48px 1fr auto; gap:14px; align-items:center; padding:14px 16px; cursor:pointer; }
.app-ico { width:48px; height:48px; border-radius:10px; display:grid; place-items:center; color:#fff; font-size:22px; }
.app-h .n { font-weight:600; font-size:15px; display:flex; gap:8px; align-items:center; }
.app-h .d { font-size:12px; color:var(--text-secondary); margin-top:3px; }
.state { font-size:11px; font-weight:700; border-radius:9px; padding:2px 8px; display:inline-flex; gap:5px; align-items:center; }
.state::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
.st-run { background:var(--success-soft); color:var(--success); }
.st-bg { background:var(--accent-soft-2); color:var(--accent-dark); } body.dark .st-bg { color:var(--accent-light); }
.st-off { background:var(--layer-tertiary); color:var(--text-secondary); }
.st-new { background:var(--warning-soft); color:#8A6D00; } body.dark .st-new { color:var(--warning); }
.app-b { border-top:1px solid var(--stroke-divider); padding:12px 16px 14px; display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; background:var(--layer-subtle); }
.app-b h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-tertiary); margin:0 0 6px; font-weight:600; }
.perm { display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:3px 0; }
.perm small { display:block; color:var(--text-secondary); font-size:11px; }
.kv { display:grid; grid-template-columns:150px 1fr; gap:4px 10px; font-size:12px; }
.kv span:nth-child(odd) { color:var(--text-secondary); }
.app-f { grid-column:1/-1; display:flex; gap:8px; justify-content:flex-end; padding-top:4px; }
.empty { border:1px dashed var(--stroke-divider); border-radius:8px; padding:14px 16px; display:flex; gap:12px; align-items:center; color:var(--text-secondary); font-size:13px; }
/* --- Mockup 18: Galerie mit Ordnerleiste --- */
.content { display:grid; grid-template-columns:auto 1fr; overflow:hidden; }
.fpane { width:270px; border-right:1px solid var(--stroke-divider); display:flex; flex-direction:column; min-height:0; background:var(--layer-subtle); transition:width .15s; }
.fpane.closed { width:44px; }
.fph { display:flex; align-items:center; gap:8px; padding:12px 10px 8px 14px; font-weight:600; font-size:13px; }
.fph .ic { color:var(--text-secondary); }
.fph .sp { flex:1; }
.ibtn { width:28px; height:28px; border-radius:4px; border:0; background:transparent; display:grid; place-items:center; cursor:pointer; color:var(--text-secondary); font-family:'Segoe Fluent Icons'; font-size:12px; }
.ibtn:hover { background:var(--layer-secondary); }
.fpane.closed .fph span:not(.ic), .fpane.closed .fbody, .fpane.closed .ffoot { display:none; }
.fpane.closed .fph { flex-direction:column; padding:10px 6px; }
.fsearch { margin:0 10px 6px; padding:5px 8px; border:1px solid var(--stroke-divider); border-bottom-color:var(--ctl-bottom); border-radius:4px; background:var(--layer-card); font-size:12px; color:var(--text-tertiary); display:flex; gap:6px; align-items:center; }
.fbody { flex:1; overflow:auto; padding:2px 6px; }
.node { display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:4px; position:relative; font-size:13px; cursor:pointer; white-space:nowrap; }
.node:hover { background:var(--layer-secondary); }
.node .exp { width:12px; color:var(--text-tertiary); font-family:'Segoe Fluent Icons'; font-size:8px; }
.node .fic { color:var(--brand-amber); font-size:14px; }
.node .nm { overflow:hidden; text-overflow:ellipsis; }
.node .tm { display:inline-flex; gap:4px; color:var(--text-tertiary); font-size:10px; margin-left:4px; }
.node .cnt { color:var(--text-tertiary); font-size:11px; margin-left:auto; padding-left:6px; }
.node.sel { background:var(--accent-soft-2); font-weight:600; }
.node.sel::before { content:''; position:absolute; left:0; top:5px; bottom:5px; width:3px; border-radius:2px; background:var(--accent); }
.node.sel .fic { color:var(--accent); }
.node.root { font-weight:600; margin-top:6px; }
.node.root .fic { color:var(--text-secondary); }
.node.off { color:var(--text-tertiary); }
.ffoot { border-top:1px solid var(--stroke-divider); padding:8px 12px; font-size:12px; color:var(--text-secondary); display:grid; gap:6px; }
.ffoot label { display:flex; gap:8px; align-items:center; }
.main { min-width:0; display:grid; grid-template-rows:auto auto 1fr; }
.ghead { display:flex; align-items:center; gap:12px; padding:16px 20px 6px; }
.ghead h1 { margin:0; font-size:26px; font-weight:600; }
.crumb { font-size:13px; color:var(--text-secondary); display:flex; gap:6px; align-items:center; }
.crumb b { color:var(--text-primary); font-weight:600; }
.crumb .sepc { font-family:'Segoe Fluent Icons'; font-size:8px; color:var(--text-tertiary); }
.fbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:4px 20px 10px; border-bottom:1px solid var(--stroke-divider); }
.chip { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 6px 0 10px; border-radius:14px; font-size:12px; background:var(--layer-card); border:1px solid var(--stroke-card); }
.chip.on { background:var(--accent-soft-2); border-color:transparent; color:var(--accent-dark); font-weight:600; } body.dark .chip.on { color:var(--accent-light); }
.chip .x { font-family:'Segoe Fluent Icons'; font-size:9px; width:18px; height:18px; display:grid; place-items:center; border-radius:50%; cursor:pointer; }
.chip .x:hover { background:var(--layer-tertiary); }
.chip.add { color:var(--text-secondary); padding-right:10px; }
.fbar .sp { flex:1; }
.fbar .res { font-size:12px; color:var(--text-secondary); }
.gal { display:grid; grid-template-columns:repeat(var(--cols,6),1fr); gap:6px; padding:12px 20px 20px; align-content:start; overflow:auto; }
.tile { aspect-ratio:1; border-radius:4px; position:relative; }
.tile .mk { position:absolute; top:5px; left:5px; height:18px; padding:0 6px; border-radius:9px; background:rgba(0,0,0,.52); color:#fff; font-size:10px; display:inline-flex; align-items:center; gap:3px; font-family:'Segoe Fluent Icons'; }
.menu { position:absolute; z-index:40; min-width:250px; background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; box-shadow:var(--shadow-flyout); padding:4px; font-size:13px; }
body.dark .menu { background:#2B2B2B; }
.mi { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; padding:6px 8px; border-radius:4px; white-space:nowrap; }
.mi:hover { background:var(--layer-secondary); }
.mi .ic { font-size:14px; color:var(--text-secondary); }
.mi .k { font-size:11px; color:var(--text-tertiary); }
.mi.danger { color:var(--danger); } .mi.danger .ic { color:var(--danger); }
.msep { height:1px; background:var(--stroke-divider); margin:4px 6px; }
.note { position:absolute; right:20px; bottom:16px; width:330px; font-size:12px; line-height:1.55; color:var(--text-secondary); background:var(--layer-card); border:1px solid var(--stroke-card); border-radius:8px; padding:10px 12px; box-shadow:var(--shadow-card); }
body.dark .note { background:#2B2B2B; }
.note b { color:var(--text-primary); }
.drop { outline:2px dashed var(--accent); outline-offset:-2px; background:var(--accent-soft); }
</style>
</head>
<body>
<div class="mock-bar">
  <span><b>Mockup 18 · Galerie mit Ordnerleiste · Entwurf</b></span>
  <span class="grp">Design: <button id="mbLight">Hell</button><button id="mbDark" class="on">Dunkel</button></span>
  <span class="grp">Ansicht: <button data-v="open" class="on">Leiste offen</button><button data-v="combo">Ordner + Filter</button><button data-v="menu">Rechtsklick Ordner</button><button data-v="drag">Fotos auf Ordner ziehen</button><button data-v="closed">Leiste zu</button></span>
  <span class="note2" style="margin-left:auto;color:#AAB">Menüpunkt „Ordner“ entfällt</span>
</div>

<div class="stage-wrap"><div class="win-box" id="winBox">
<div class="window" id="win">
  <div class="titlebar"><span class="tile" style="aspect-ratio:auto"></span> Lumora<span class="wc"><span>&#xE921;</span><span>&#xE922;</span><span>&#xE8BB;</span></span></div>
  <nav class="nav">
    <div class="wbs">lumora</div>
    <div class="lib-switch"><span class="ic">&#xE8F1;</span><div><b>Familienfotos</b><small>Bibliothek wechseln</small></div></div>
    <div class="nav-item active"><span class="ic">&#xE91B;</span>Galerie</div>
    <div class="nav-item"><span class="ic">&#xE8F1;</span>Alben</div>
    <div class="nav-item"><span class="ic">&#xE786;</span>Storys</div>
    <div class="nav-item"><span class="ic">&#xE716;</span>Personen</div>
    <div class="nav-item"><span class="ic">&#xE707;</span>Orte</div>
    <div class="spacer"></div>
    <div class="nav-item"><span class="ic">&#xE713;</span>Einstellungen</div>
  </nav>
  <main class="content" id="content"></main>
  <div class="statusbar"><span><span class="ic s">&#xE8F1;</span> Familienfotos</span><span id="sbinfo">212 von 5 212 Fotos</span><span class="r" style="color:var(--text-tertiary)"><span class="ic s">&#xE73E;</span> Keine Aktivität</span></div>
</div>
</div></div>

<script>
const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const ph=['#9EC9E8,#3F7FB2','#F7D99A,#C78F2B','#C8E0B5,#5E8B47','#E6B8C8,#A0567A','#D8D3EC,#6E64A8','#F3B9A8,#B4553F','#BFD9DA,#3E8287'];
const TAG='&#xE8EC;', CAT='&#xE8A9;';
// [Tiefe, Name, Anzahl, offen?, Tags, Kategorien, Klasse]
const TREE=[
 [0,'Alle Fotos der Bibliothek','5 212',null,0,0,'root'],
 [0,'Bibliotheksordner','4 108',true,0,0,'root'],
 [1,'2023','2 010',false,31,8],
 [1,'2024','1 380',true,12,0],
 [2,'Urlaub Dolomiten','212',null,86,40,'sel'],
 [2,'Geburtstag Paul','64',null,0,31],
 [2,'Wanderungen','304',true,40,0],
 [3,'Rax','58',null,12,0],
 [3,'Schneeberg','91',null,0,0],
 [1,'2025','718',false,0,0],
 [0,'Eingänge','1 104',true,0,0,'root'],
 [1,'Handy-Import','1 104',null,0,0],
 [0,'Offline: Externe Platte','—',null,0,0,'root off']];
function tree(sel){
  return TREE.map(([d,n,c,o,t,k,cls=''])=>{
    const isSel = sel? n===sel : cls.includes('sel');
    const exp = o===null?'':(o?'&#xE70D;':'&#xE76C;');
    const ic = cls.includes('root') ? (n.startsWith('Alle')?'&#xE91B;':(n.startsWith('Offline')?'&#xEDA2;':'&#xE8B7;')) : '&#xE8B7;';
    const tm = (t||k)?`<span class="tm">${t?`<span class="ic s">${TAG}</span>${t}`:''}${k?` <span class="ic s">${CAT}</span>${k}`:''}</span>`:'';
    return `<div class="node ${cls.replace('sel','')} ${isSel?'sel':''}" style="padding-left:${8+d*16}px"><span class="exp">${exp}</span><span class="ic fic">${ic}</span><span class="nm">${n}</span>${tm}<span class="cnt">${c}</span></div>`;
  }).join('');
}
function pane(open, sel){
  return `<aside class="fpane ${open?'':'closed'}" id="fpane">
    <div class="fph"><span class="ic">&#xE8B7;</span><span>Ordner</span><span class="sp"></span><button class="ibtn" title="Ordner hinzufügen / Bibliothek verwalten">&#xE710;</button><button class="ibtn" id="tog" title="${open?'Leiste einklappen (Strg+B)':'Ordnerleiste öffnen (Strg+B)'}">${open?'&#xE76B;':'&#xE76C;'}</button></div>
    <div class="fsearch"><span class="ic s">&#xE721;</span>Ordner suchen…</div>
    <div class="fbody">${tree(sel)}</div>
    <div class="ffoot"><label><span class="chk on">&#xE73E;</span>Unterordner einschließen</label><span style="color:var(--text-tertiary)">2 Ordner ausgeschlossen · <u>verwalten</u></span></div>
  </aside>`;
}
function tiles(n, drop){ return Array.from({length:n},(_,i)=>`<span class="tile ${drop&&i<3?'sel':''}" style="background:linear-gradient(160deg,${ph[i%7]})">${i%4===0?`<span class="mk">${TAG}</span>`:''}</span>`).join(''); }
function main(opts){
  const {chips, crumb, cols=6, res='212 Fotos'} = opts;
  return `<section class="main"><div class="ghead"><h1>Galerie</h1><div class="crumb">${crumb}</div></div>
   <div class="fbar">${chips}<span class="chip add"><span class="ic s">&#xE710;</span>Filter</span><span class="sp"></span><span class="res">${res}</span><span class="chip">Neueste zuerst <span class="ic s">&#xE70D;</span></span></div>
   <div class="gal" style="--cols:${cols}">${tiles(30)}</div></section>`;
}
const folderChip = n=>`<span class="chip on"><span class="ic s">&#xE8B7;</span>Ordner: ${n} <span class="x">&#xE711;</span></span>`;
const crumbOf = p=>p.map((x,i)=>i===p.length-1?`<b>${x}</b>`:`${x}<span class="sepc">&#xE76C;</span>`).join('');
const V={
 open:()=>pane(true)+main({chips:folderChip('Urlaub Dolomiten'),crumb:crumbOf(['Bibliotheksordner','2024','Urlaub Dolomiten'])})
   +`<div class="note"><b>Eine Ansicht statt zwei:</b> links die Ordnerleiste (der heutige Reiter „Ordner“), rechts die Galerie. Klick auf einen Ordner setzt den Filter-Chip „Ordner: …“; das Kreuz am Chip oder „Alle Fotos der Bibliothek“ zeigt wieder alles. Pfad oben ist anklickbar.</div>`,
 combo:()=>pane(true)+main({chips:folderChip('2024')+`<span class="chip on"><span class="ic s">&#xE716;</span>Person: Anna <span class="x">&#xE711;</span></span><span class="chip on"><span class="ic s">&#xE734;</span>ab 4 Sterne <span class="x">&#xE711;</span></span>`,crumb:crumbOf(['Bibliotheksordner','2024']),res:'38 Fotos'}).replace(tree(),tree('2024'))
   +`<div class="note"><b>Kombinierbar:</b> Ordner „2024“ (mit Unterordnern) + Person + Sterne. Wechselt man in der Leiste den Ordner, bleiben die anderen Filter stehen.</div>`,
 menu:()=>pane(true)+main({chips:folderChip('Urlaub Dolomiten'),crumb:crumbOf(['Bibliotheksordner','2024','Urlaub Dolomiten'])})
   +`<div class="menu" style="left:150px;top:300px">
     <div class="mi"><span class="ic">&#xE8A7;</span>Nur diesen Ordner zeigen<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE768;</span>Diashow<span class="k"></span></div>
     <div class="msep"></div>
     <div class="mi"><span class="ic">&#xE8AC;</span>Umbenennen…<span class="k">F2</span></div>
     <div class="mi"><span class="ic">&#xE8DE;</span>Verschieben nach…<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE8F4;</span>Neuer Unterordner…<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE896;</span>In die Bibliothek übernehmen…<span class="k"></span></div>
     <div class="msep"></div>
     <div class="mi"><span class="ic">&#xEB9F;</span>Titelbild des Ordners ▸<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE8EC;</span>Alle Fotos taggen / kategorisieren…<span class="k"></span></div>
     <div class="msep"></div>
     <div class="mi"><span class="ic">&#xE72C;</span>Neu einlesen<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE74D;</span>Fehlende entfernen (3)<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE8D8;</span>Ordner ausschließen…<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE838;</span>Im Explorer anzeigen<span class="k"></span></div>
     <div class="msep"></div>
     <div class="mi danger"><span class="ic">&#xE74D;</span>In den Papierkorb…<span class="k">Entf</span></div>
   </div>
   <div class="note"><b>Alle Ordner-Aktionen</b> von heute (0.4.30/0.4.33) wandern mit in die Leiste. Neu vorgeschlagen: „Neuer Unterordner…“, „Titelbild des Ordners“, „Alle Fotos taggen/kategorisieren…“, „Neu einlesen“ nur für diesen Ordner.</div>`,
 drag:()=>pane(true,'Wanderungen')
   +`<section class="main"><div class="ghead"><h1>Galerie</h1><div class="crumb">${crumbOf(['Bibliotheksordner','2024','Wanderungen'])}</div></div>
     <div class="fbar">${folderChip('Wanderungen')}<span class="sp"></span><span class="res">3 ausgewählt</span></div>
     <div class="gal" style="--cols:6">${tiles(30,true)}</div></section>`
   +`<div class="note"><b>Fotos auf einen Ordner ziehen</b> verschiebt sie (mit Strg: kopieren, falls „Kopieren nach…“ kommt) – mit Rückfrage und Rückgängig, Fortschritt unten rechts. Ordner auf Ordner ziehen verschiebt den Ordner (wie 0.4.33).</div>`,
 closed:()=>pane(false)+main({chips:folderChip('Urlaub Dolomiten'),crumb:crumbOf(['Bibliotheksordner','2024','Urlaub Dolomiten']),cols:7})
   +`<div class="note"><b>Leiste zu:</b> schmale Kante mit Ordner-Symbol, mehr Platz für Fotos. Der Ordner-Filter bleibt als Chip sichtbar. Lumora merkt sich offen/zu. Strg+B schaltet um.</div>`};
function view(v){
  $$('.mock-bar [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#content').innerHTML=V[v]();
  $('#sbinfo').textContent = v==='combo' ? '38 von 5 212 Fotos' : '212 von 5 212 Fotos';
  const t=$('#tog'); if(t) t.onclick=()=>view(v==='closed'?'open':'closed');
  if(v==='drag') $$('.node').forEach(n=>{ if(n.querySelector('.nm')?.textContent==='Rax') n.classList.add('drop'); });
}
document.addEventListener('click',e=>{ const v=e.target.closest('[data-v]'); if(v) view(v.dataset.v); });
function fit(){ const w=1280,h=800,win=$('#win'); win.style.width=w+'px'; win.style.height=h+'px'; const s=Math.min(1,(document.documentElement.clientWidth-40)/w);
  win.style.transform=`scale(${s})`; $('#winBox').style.width=w*s+'px'; $('#winBox').style.height=h*s+'px'; }
function theme(d){ document.body.classList.toggle('dark',d); $('#mbLight').classList.toggle('on',!d); $('#mbDark').classList.toggle('on',d); }
$('#mbLight').onclick=()=>theme(false); $('#mbDark').onclick=()=>theme(true);
window.addEventListener('resize',fit); fit(); theme(true); view('open');
</script>
</body>
</html>
