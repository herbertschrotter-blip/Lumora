  <div class="statusbar"><span><span class="ic s">&#xE8F1;</span> Shootings</span><span id="sbinfo">8 Sets · 1 412 Fotos</span><span class="r" style="color:var(--text-tertiary)"><span class="ic s">&#xE73E;</span> Keine Aktivität</span></div>
</div>
</div></div>

<script>
const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const ph=['#9EC9E8,#3F7FB2','#F7D99A,#C78F2B','#C8E0B5,#5E8B47','#E6B8C8,#A0567A','#D8D3EC,#6E64A8','#F3B9A8,#B4553F','#BFD9DA,#3E8287','#E8E2D6,#8C7B60','#C9C9CF,#55555F'];
const TAG='&#xE8EC;', CAT='&#xE8A9;';
// Namen erfunden. [Name, Fotos, Zeitraum, Grundfarbe, Tags, Unterordner]
const SETS=[
 ['Studio – weißer Hintergrund','248','12. Mai 2024',8,14,0],
 ['Seeufer im Abendlicht','186','3. Jun 2024',0,22,0],
 ['Altstadt Porträts','97','21.–22. Jun 2024',5,0,0],
 ['Herbstwald','312','5. Okt 2024',1,9,0],
 ['Industriehalle','154','19. Okt 2024',8,0,0],
 ['Schwarz-Weiß Serie','5','2. Nov 2024',8,0,0],
 ['Bahnhof bei Nacht','221','15. Nov 2024',4,3,0],
 ['Winterfeld','189','7. Dez 2024',6,0,0]];
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
const ASPECTS=[2/3,2/3,2/3,3/4,3/2,4/5,2/3,1];
let rowH=150, winW=1280;

// Zeile füllen: erstes Foto, dann zufällige, das letzte Foto immer am Ende — so viele, wie in die Breite passen
function strip(set, idx, width, h){
  const [name,count,,base]=set, total=parseInt(count.replace(/\s/g,''));
  const gap=4; const items=[];
  const mk=(n,kind)=>({n,kind,a:ASPECTS[Math.floor(rnd()*ASPECTS.length)]});
  const first=mk(1,'first'), last=mk(total,'last');
  let used=first.a*h + (total>1? gap+last.a*h : 0);
  const middle=[];
  const picked=new Set([1,total]);
  while(middle.length < total-2){
    const c=mk(0,'rand'); const w=c.a*h+gap;
    if(used+w > width) break;
    let n; do { n=2+Math.floor(rnd()*(total-2)); } while(picked.has(n)); picked.add(n); c.n=n;
    middle.push(c); used+=w;
  }
  middle.sort((x,y)=>x.n-y.n);
  const all=[first,...middle]; if(total>1) all.push(last);
  const html=all.map((p,i)=>{
    const col=ph[(base+i*3)%ph.length];
    const pos=p.kind==='first'?`<span class="pos"><span class="ic">&#xE892;</span>erstes</span>`:p.kind==='last'?`<span class="pos">letztes<span class="ic">&#xE893;</span></span>`:'';
    const star=(i%5===2)?'<span class="star">&#xE735;&#xE735;&#xE735;&#xE735;</span>':'';
    const w=Math.round(p.a*h), fill=all.length<total; // Rest der Breite gleichmäßig verteilen (wie die Collage); kleine Sets bleiben natürlich breit
    return `<span class="ph" style="${fill?`flex:${w} 1 ${w}px`:`width:${w}px`};background:linear-gradient(160deg,${col})" title="Foto ${p.n} von ${total}">${pos}${star}</span>`;
  }).join('');
  const shown=all.length, rest=total-shown;
  return {html, shown, total};
}

function setRow(set, idx, opts={}){
  const [name,count,date,,tags,cats]=set;
  const width = (winW-232) - (opts.paneOpen===false?44:270) - 40 - (opts.indent?36:0);
  const s=strip(set, idx, width, rowH);
  const tm = (tags||cats)?`<span class="tm">${tags?`<span class="ic s">${TAG}</span>${tags}`:''}${cats?` <span class="ic s">${CAT}</span>${cats}`:''}</span>`:'';
  const info = s.shown<s.total ? `${count} Fotos · ${s.shown} gezeigt` : `${count} Fotos · alle gezeigt`;
  return `<div class="set ${opts.hot?'hot':''}"><div class="seth"><span class="ic fic">&#xE8B7;</span><b title="Ordner öffnen">${name}</b><span class="meta">${date} · ${info}</span>${tm}
     <span class="acts"><button class="ibtn" title="Andere Fotos zeigen">&#xE8B1;</button><button class="ibtn" title="Diashow dieses Sets">&#xE768;</button><button class="ibtn" title="Ordner öffnen">&#xE8A7;</button></span></div>
     <div class="strip" style="--rowh:${rowH}px">${s.html}</div></div>`;
}

const TREE=[
 [0,'Alle Fotos der Bibliothek','1 412',null,'root'],
 [0,'Bibliotheksordner','1 412',true,'root'],
 [1,'2023','—',false,''],
 [1,'Shootings 2024','1 412',true,'sel'],
 ...SETS.map(s=>[2,s[0],s[1],null,'']),
 [1,'Shootings 2025','—',false,'']];
function tree(){
  return TREE.map(([d,n,c,o,cls])=>{
    const exp = o===null?'':(o?'&#xE70D;':'&#xE76C;');
    const ic = cls.includes('root') ? (n.startsWith('Alle')?'&#xE91B;':'&#xE8B7;') : '&#xE8B7;';
    return `<div class="node ${cls}" style="padding-left:${8+d*16}px"><span class="exp">${exp}</span><span class="ic fic">${ic}</span><span class="nm">${n}</span><span class="cnt">${c}</span></div>`;
  }).join('');
}
function pane(){
  return `<aside class="fpane" id="fpane">
    <div class="fph"><span class="ic">&#xE8B7;</span><span>Ordner</span><span class="sp"></span><button class="ibtn">&#xE710;</button><button class="ibtn">&#xE76B;</button></div>
    <div class="fsearch"><span class="ic s">&#xE721;</span>Ordner suchen…</div>
    <div class="fbody">${tree()}</div>
    <div class="ffoot"><label><span class="chk on">&#xE73E;</span>Unterordner einschließen</label></div>
  </aside>`;
}
const crumb=`Bibliotheksordner<span class="sepc">&#xE76C;</span><b>Shootings 2024</b>`;
function head(mode, res){
  const vs=['Raster','Liste','Collage','Ordner'].map((n,i)=>{
    const ic=['&#xF0E2;','&#xE8FD;','&#xE80A;','&#xE8B7;'][i];
    return `<span class="${n===mode?'on':''}" data-mode="${n}"><span class="ic s">${ic}</span>${n}</span>`; }).join('');
  return `<div class="ghead"><h1>Galerie</h1><div class="crumb">${crumb}</div></div>
   <div class="fbar"><span class="chip on"><span class="ic s">&#xE8B7;</span>Ordner: Shootings 2024 <span class="x">&#xE711;</span></span><span class="chip add"><span class="ic s">&#xE710;</span>Filter</span><span class="sp"></span>
   ${mode==='Ordner'?`<span class="zoom"><span class="ic s">&#xE71F;</span><input type="range" min="100" max="260" value="${rowH}" id="zoomR"><span class="ic s">&#xE8A3;</span></span><button class="btn-std" id="shuffle"><span class="ic s">&#xE8B1;</span>Neu mischen</button>`:''}
   <span class="res">${res}</span><span class="vsw">${vs}</span></div>`;
}
function rowsView(note, opts={}){
  seed=shuffleSeed||opts.seed||7;
  const rows=SETS.map((s,i)=>setRow(s,i,{hot:opts.hot===i})).join('');
  return pane()+`<section class="main" style="grid-template-rows:auto auto auto 1fr">${head('Ordner','8 Sets · 1 412 Fotos')}
    <div class="legend"><span class="pos"><span class="ic">&#xE892;</span>erstes</span> und <span class="pos">letztes<span class="ic">&#xE893;</span></span> Foto des Ordners stehen immer außen, dazwischen zufällige in Aufnahme-Reihenfolge</div>
    <div class="sets">${rows}</div></section>`+(note?`<div class="note">${note}</div>`:'');
}
const V={
 rows:()=>rowsView(`<b>Ansicht „Ordner“:</b> Je Unterordner (Set) eine Zeile. Lumora füllt sie mit so vielen Fotos, wie in die Breite passen: <b>erstes</b> und <b>letztes</b> Foto immer, dazwischen zufällige (nach Aufnahmezeit sortiert). Fenster schmaler → weniger Fotos. Klick auf ein Foto öffnet die Lightbox in diesem Set, Klick auf den Namen öffnet den Ordner. „Schwarz-Weiß Serie“ hat nur 5 Fotos – alle gezeigt.`),
 big:()=>{ if(rowH===150) rowH=230; return rowsView(`<b>Zeilenhöhe</b> mit dem Regler oben (wie die Kachelgröße heute). Größere Zeilen → weniger Fotos je Set. „Neu mischen“ zieht andere Zufallsfotos (erstes und letztes bleiben); Lumora merkt sich die Ziehung, bis du neu mischst oder Fotos dazukommen.`,{seed:11}); },
 nested:()=>{
   seed=5;
   const inner=[['Outfit 1 – Kleid rot','64','12. Mai 2024',3,0,0],['Outfit 2 – Jeans','71','12. Mai 2024',1,0,0],['Outfit 3 – Mantel','58','12. Mai 2024',6,0,0]];
   const html=setRow(SETS[0],0)+`<div class="sub">${inner.map((s,i)=>setRow(s,i,{indent:true})).join('')}</div>`+SETS.slice(1,4).map((s,i)=>setRow(s,i+1)).join('');
   return pane()+`<section class="main" style="grid-template-rows:auto auto 1fr">${head('Ordner','8 Sets · 1 412 Fotos')}<div class="sets">${html}</div></section>`
     +`<div class="note"><b>Set mit Unterordnern:</b> Die Zeile des Sets zeigt Fotos aus allen Unterordnern (erstes/letztes über das ganze Set). Darunter eingerückt je Unterordner eine eigene Zeile – nur eine Ebene tief, tiefere Ordner zählen zu ihrem Unterordner. Fotos direkt im geöffneten Ordner (ohne Unterordner) bekämen eine eigene erste Zeile „Fotos in Shootings 2024“.</div>`;
 },
 menu:()=>rowsView('',{hot:1}).replace('<div class="sets">','<div class="sets">')+`<div class="menu" style="left:520px;top:380px">
     <div class="mi"><span class="ic">&#xE8A7;</span>Ordner öffnen<span class="k">Eingabe</span></div>
     <div class="mi"><span class="ic">&#xE8B1;</span>Andere Fotos zeigen<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE768;</span>Diashow dieses Sets<span class="k"></span></div>
     <div class="msep"></div>
     <div class="mi"><span class="ic">&#xEB9F;</span>Als Titelbild des Ordners<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE8EC;</span>Alle Fotos des Sets taggen / kategorisieren…<span class="k"></span></div>
     <div class="mi"><span class="ic">&#xE735;</span>Alle Fotos des Sets bewerten ▸<span class="k"></span></div>
     <div class="msep"></div>
     <div class="mi"><span class="ic">&#xE8AC;</span>Umbenennen…<span class="k">F2</span></div>
     <div class="mi"><span class="ic">&#xE838;</span>Im Explorer anzeigen<span class="k"></span></div>
   </div><div class="note"><b>Rechtsklick auf den Set-Namen</b> bzw. auf eine leere Stelle der Zeile: Aktionen für den ganzen Ordner. Rechtsklick auf ein Foto zeigt das bekannte Foto-Menü (Mockup 18). „Als Titelbild des Ordners“ übernimmt das Foto unter der Maus.</div>`,
 normal:()=>pane()+`<section class="main">${head('Raster','1 412 Fotos')}<div class="gal" style="--cols:7">${Array.from({length:35},(_,i)=>`<span class="tile" style="background:linear-gradient(160deg,${ph[i%9]})"></span>`).join('')}</div></section>`
   +`<div class="note"><b>Vorher:</b> Der Ordner „Shootings 2024“ mit Unterordnern zeigt alle 1 412 Fotos gemischt im Raster – welches Set was enthält, sieht man nur, wenn man jeden Ordner einzeln öffnet. Umschalten oben rechts: <b>Ordner</b>.</div>`};
let cur='rows', shuffleSeed=0;
// Zeichnet die aktuelle Ansicht neu (Regler, Neu mischen, Fensterbreite) und hängt die Bedienelemente an
function render(){
  $$('.mock-bar [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===cur));
  $('#content').innerHTML = (cur==='rows' && shuffleSeed) ? V.rows().replace(/^/,'') : V[cur]();
  const z=$('#zoomR'); if(z) z.oninput=()=>{ rowH=+z.value; render(); };
  const sh=$('#shuffle'); if(sh) sh.onclick=()=>{ shuffleSeed=Math.floor(Math.random()*1e6)+1; render(); };
  $$('.vsw [data-mode]').forEach(m=>m.onclick=()=>{ cur = m.dataset.mode==='Ordner' ? 'rows' : 'normal'; render(); });
}
function view(v){ cur=v; shuffleSeed=0; if(v!=='big') rowH=150; render(); }
document.addEventListener('click',e=>{
  const v=e.target.closest('.mock-bar [data-v]'); if(v) view(v.dataset.v);
  const w=e.target.closest('.mock-bar [data-w]'); if(w){ winW=+w.dataset.w; $$('.mock-bar [data-w]').forEach(b=>b.classList.toggle('on',b===w)); fit(); render(); } });function fit(){ const w=winW,h=800,win=$('#win'); win.style.width=w+'px'; win.style.height=h+'px'; const s=Math.min(1,(document.documentElement.clientWidth-40)/w);
  win.style.transform=`scale(${s})`; $('#winBox').style.width=w*s+'px'; $('#winBox').style.height=h*s+'px'; }
function theme(d){ document.body.classList.toggle('dark',d); $('#mbLight').classList.toggle('on',!d); $('#mbDark').classList.toggle('on',d); }
$('#mbLight').onclick=()=>theme(false); $('#mbDark').onclick=()=>theme(true);
window.addEventListener('resize',fit); fit(); theme(true); view('rows');
</script>
